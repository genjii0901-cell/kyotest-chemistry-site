<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>共テ化学 過去問道場</title>
<style>
[hidden]{display:none!important}
:root{
 --paper:#EEF2F4;--sheet:#fff;--ink:#16212B;--muted:#5A6672;--line:#D3DCE2;
 --brand:#0E6E78;--brand-soft:#DDF0F1;--navy:#1F3A7A;

 padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;min-height:24px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.streakp{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}.streakp b{color:var(--ink);font-size:.95rem}.streakp svg{width:15px;height:15px;fill:#F0812E}.streakp .td{border-left:1px solid var(--line);padding-left:6px}.streakp .td.ok{color:var(--ok)}

.brand h1 b{color:var(--brand)}
.brand small{display:block;font-size:.76rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--sheet);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;font-size:.7rem;min-height:54px;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
@media (min-width:760px){.wrap{padding-bottom:64px}nav.tabs{position:static;display:flex;border:0;padding:0;background:transparent}nav.tabs button{flex-direction:row;border:1px solid var(--line);border-radius:999px;min-height:auto;padding:6px 14px;font-size:.88rem;background:var(--sheet);color:var(--ink)}nav.tabs svg{display:none}nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}.small{font-size:.82rem}.note{font-size:.8rem;color:var(--muted);margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h2{font-size:1.08rem;margin:0}h3{font-size:.95rem;margin:0}
.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;min-height:42px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.8rem}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.big{width:100%;min-height:56px;font-size:1rem}
.btn:disabled{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.84rem;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.chip{display:inline-flex;align-items:center;font-size:.72rem;border:1px solid var(--line);padding:0 8px;border-radius:999px;color:var(--muted);white-space:nowrap;line-height:1.7}
.chip.t-理論{border-color:transparent;background:#E3EAFB;color:#2A4FA8}.chip.t-無機{border-color:transparent;background:#E0F2EC;color:#1D7357}.chip.t-有機{border-color:transparent;background:#FBEBD9;color:#9A5A12}.chip.t-総合{border-color:transparent;background:#EFE5FA;color:#6B3FA8}
@media (prefers-color-scheme:dark){.chip.t-理論{background:#1E2A47;color:#9FB8F5}.chip.t-無機{background:#163329;color:#7DD5B3}.chip.t-有機{background:#3A2A16;color:#F2BE7F}.chip.t-総合{background:#2E2343;color:#C9A8F2}}
.meter{height:7px;background:var(--paper);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--brand)}
.warn{background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:999px;font-size:.86rem;z-index:30;max-width:90vw;text-align:center}
input[type=text]{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;padding:6px 8px;min-width:0}
.setline{display:flex;justify-content:space-between;gap:12px;align-items:center}
/* home */
.yearh{font-weight:800;font-size:1.15rem;margin:4px 0 -4px}
.sets{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.setc{min-width:0}
.setc{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;font-size:.9rem}
.setc .k{font-weight:800;font-size:1.05rem}
.setc .b{font-size:.78rem;color:var(--muted)}
.setc .sc{font-weight:800;color:var(--brand);font-size:1.1rem}
.daily{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.daily .fire{font-size:1.05rem;white-space:nowrap;display:flex;align-items:center;gap:3px}.daily .fire svg{width:24px;height:24px;fill:#F0812E}.daily .fire b{font-size:1.4rem}.daily .goal{flex:1;display:flex;flex-direction:column;gap:5px;font-size:.95rem}.daily.ok{border-color:var(--ok)}.daily.ok .meter i{background:var(--ok)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:.86rem;line-height:1.4}
.tool svg{flex:none;width:34px;height:34px;fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-size:.95rem}
.resume{border:2px solid var(--brand)}
/* 大問リスト */
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qn{font-weight:800;width:3.4em}
.qrow .meta{font-size:.78rem;color:var(--muted)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.topic .nm{font-weight:800;font-size:1.05rem}
.topic .d{font-size:.76rem;color:var(--muted);line-height:1.5}
/* 成績 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .v{font-weight:800;font-size:1.5rem;line-height:1.2}
.tile .l{font-size:.76rem;color:var(--muted)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.hrow .s{font-weight:800}
.trow{display:grid;grid-template-columns:4.2em minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:.86rem}
.rkr{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;padding:6px 4px;border-top:1px solid var(--line);font-size:.88rem}
.rkr.me{background:var(--brand-soft);border-radius:6px}
.rkno{font-weight:800;text-align:center}
.rkscroll{max-height:320px;overflow:auto}
/* 結果 */
.score{display:flex;align-items:baseline;gap:8px}.score .big{font-size:2.6rem;font-weight:800;line-height:1;color:var(--brand)}
table.rt{width:100%;border-collapse:collapse;font-size:.86rem}
table.rt th,table.rt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.perfect{font-size:2rem;font-weight:900;color:var(--mark);letter-spacing:.08em;animation:pf .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pf{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
table.rt th{font-weight:500;color:var(--muted);font-size:.76rem}
table.rt td.l{text-align:left}
td.okc{color:var(--ok);font-weight:800}td.ngc{color:var(--ng);font-weight:800}
/* ===== 演習画面 ===== */
body.in-exam{overflow:hidden}
body.in-exam nav.tabs,body.in-exam .wrap{display:none}
.exam{position:fixed;inset:0;z-index:8;background:var(--paper);padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
.exhead{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--sheet);border-bottom:1px solid var(--line)}
.exhead .ttl{flex:1;min-width:0;font-size:.84rem;line-height:1.25;overflow:hidden}
.exhead .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exhead .ttl span{color:var(--muted);font-size:.74rem;white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--sheet);border-radius:8px;min-width:42px;height:40px;padding:0 8px;font-size:.74rem;line-height:1.1;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tmr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;min-width:62px}
.tmr.over{color:var(--ng);border-color:var(--ng)}.tmr.paused{opacity:.55}
.exbody{flex:1;min-height:0;position:relative;display:flex}
.pane{position:relative;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pdfpane{flex:1;background:#8C969E}
@media (prefers-color-scheme:dark){.pdfpane{background:#0B0F12}}
.pages{display:flex;flex-direction:column;gap:8px;padding:8px;margin:0 auto}
.pg{position:relative;background:#fff;width:100%;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.clip{overflow:hidden;width:100%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}.clip .pg{box-shadow:none}
.exam.one .scorebox{display:none}.exam.one .pdfpane{background:var(--paper)}.exam.one .pages{padding-bottom:70px}.exam.one .widebtn{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
.widebtn{align-self:center;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#16212B;font:inherit;font-size:.82rem;font-weight:700;padding:6px 14px;cursor:pointer}
.pg canvas.pc{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.pg .ld{position:absolute;top:40%;left:0;right:0;text-align:center;color:#999;font-size:.8rem}.pg .pno{z-index:3;position:absolute;right:6px;bottom:4px;font-size:.66rem;color:#888;font-family:var(--mono)}
.inkcv{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.zoomctl{position:sticky;bottom:10px;float:right;margin:-50px 10px 0 0;display:flex;gap:4px;z-index:3}
.zoomctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.sheetpane{width:340px;flex:none;background:var(--sheet);border-left:1px solid var(--line);padding:10px 10px 30px}
.msec{margin-bottom:14px}
.msh{display:flex;gap:6px;align-items:center;padding:6px 2px;position:sticky;top:-10px;background:var(--sheet);z-index:1}
.msh b{font-size:.95rem}
.msh .lnk{margin-left:auto;border:0;background:none;color:var(--brand);font-size:.78rem;cursor:pointer;padding:4px}
.mrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;align-items:center;padding:3px 0;border-top:1px dashed var(--line)}
.mrow .bn{font-family:var(--mono);font-weight:700;font-size:.82rem;text-align:center;background:var(--ink);color:var(--sheet);border-radius:4px;line-height:1.6}
.bubs{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.bb{height:34px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bb i{display:flex;align-items:center;justify-content:center;width:20px;height:29px;border:1.5px solid var(--mark);border-radius:50%;font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--mark)}
.bb.sel i{background:var(--mark);color:#fff}
.mrow.done .bb{cursor:default}
.bb.right i{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.bb.sel.right i{background:var(--ok);border-color:var(--ok);color:#fff}
.bb.sel.wrong i{background:var(--ng);border-color:var(--ng)}
.mrow .res{grid-column:2;font-size:.72rem;color:var(--muted);margin-top:-2px}
.mrow .res b.o{color:var(--ok)}.mrow .res b.x{color:var(--ng)}
.gnote{font-size:.72rem;color:var(--muted);padding:0 0 2px 34px}
.gradebar{padding-top:8px}
.mpanel{display:flex;flex-direction:column;flex:none;width:340px;min-height:0;background:var(--sheet);border-left:1px solid var(--line)}
.mpanel .sheetpane{flex:1;width:auto;border-left:0}
.mhandle{display:none}
@media (max-width:899px),(orientation:portrait){
 .exbody{flex-direction:column}
 .mpanel{width:auto;border-left:0;border-top:1px solid var(--line);height:38%;box-shadow:0 -4px 14px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
 .exam[data-p="fold"] .mpanel{height:auto}.exam[data-p="fold"] .sheetpane{display:none}
 .exam[data-p="sheet"] .mpanel{height:auto;flex:1}.exam[data-p="sheet"] .pdfpane{display:none}
 .mhandle{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line)}
 .mhandle b{font-size:.95rem}.mhandle .num{font-size:.85rem;color:var(--muted)}
 .mhandle .sp{flex:1}
 .mhandle button{min-width:40px;height:36px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;padding:0 10px}
 .mhandle button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
 .exam:not([data-p="sheet"]) .msec:not(.cur){display:none}
 .exam:not([data-p="sheet"]) .msh,.exam:not([data-p="sheet"]) .gradebar{display:none}

}
@media (orientation:portrait) and (min-width:700px){.exam:not([data-p="sheet"]) .mpanel{height:auto;max-height:34%}.exam:not([data-p="sheet"]) .msec.cur{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.exam:not([data-p="sheet"]) .msec.cur .gnote{grid-column:1/-1}}

/* 設問1つ：マーク欄は小さく、採点ボタンをその場に出す */
.exam.one:not([data-p="fold"]) .gradebar{display:block!important;padding:8px 0 4px}
@media (max-width:899px),(orientation:portrait){.exam.one:not([data-p="sheet"]) .mpanel{height:auto;max-height:46%}}

/* 書き込みツール */
#inkbar{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 6px 24px rgba(16,24,40,.22)}
#inkbar button{width:44px;height:40px;border-radius:10px;border:1.5px solid transparent;background:transparent;display:grid;place-items:center;font-size:.66rem;line-height:1.1;padding:0;cursor:pointer}
#inkbar button.on{background:var(--brand-soft);border-color:var(--brand)}
#inkbar hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:36px}
#inkbar .dot{width:18px;height:18px;border-radius:50%}
body.inkbarH #inkbar{flex-direction:row;align-items:center;top:auto;left:50%;right:auto;transform:translateX(-50%);padding:3px 5px;gap:1px;border-radius:999px;max-width:calc(100% - 16px);background:color-mix(in srgb,var(--sheet) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.inkbarH #inkbar button{width:38px;height:38px;border-radius:999px}body.inkbarH #inkbar hr{width:0;height:22px;border-top:0;border-left:1px solid var(--line);margin:0 3px}
#inkbar button{color:var(--ink)}#inkbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#inkbar .done{width:auto!important;white-space:nowrap;padding:0 10px!important;font-size:.8rem!important;font-weight:700;color:var(--brand)}
body.inkbarH .pages{padding-bottom:64px}body.inkbarH .zoomctl{display:none}
body.inking .frank{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}.frank .frs{flex:1;display:flex;align-items:center;gap:8px}
.weakb{border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:999px;font:inherit;font-size:.74rem;padding:2px 9px;margin-left:6px;cursor:pointer;white-space:nowrap}.weakb.on,.mhandle .weakb.on{color:#B7791F;border-color:#E9B949;background:#FFF6DC}.mhandle .weakb{width:auto;height:auto}
.wkst{color:#B7791F;font-size:.74rem;font-weight:700}
.fixnote{margin:6px 8px;padding:8px 10px;border-radius:10px;background:#fff6dc;border:1px solid #f0d58a;color:#5a4300;font-size:13px;line-height:1.5}
.frgo{font-weight:700;color:var(--brand);white-space:nowrap}
.rankbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(120deg,#1F2F66,#2A5BC4);color:#fff;font:inherit;cursor:pointer;text-align:left}.rankbtn>span:first-child{flex:1;display:flex;flex-direction:column}.rankbtn small{opacity:.85;font-size:.78rem}.rankbtn .frgo{background:#fff;color:#1F2F66;border-radius:999px;padding:6px 12px}
#inkbar .hl{width:22px;height:10px;border-radius:3px;background:#F5C518;opacity:.75}
/* モーダル（周期表・計算用紙） */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.modal{align-items:center}}
.mbox{background:var(--sheet);width:100%;max-width:1000px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.mbox{border-radius:16px;max-height:92%}}
.mhead{display:flex;align-items:center;gap:8px;position:sticky;top:-12px;background:var(--sheet);padding:4px 0 8px;z-index:2}
.mhead h2{flex:1}
.ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:2px;min-width:700px}
.el{border:0;border-radius:4px;padding:2px 1px;text-align:center;line-height:1.1;cursor:pointer;background:#EEF1F4;color:#16212B;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.el .z{font-size:.56rem;opacity:.7}.el .s{font-weight:800;font-size:.95rem}.el .m{font-size:.54rem;font-family:var(--mono)}

function parseKey(k){const items=[];let q=0,s=0;
 k.trim().split(/\s+/).forEach(t=>{const m=t.match(/^(\d)\.(\d)$/);if(m){q=+m[1];s=+m[2];return}
  const [lhs,rest0]=t.split('=');const [rest,altS]=rest0.split(',');const [ans,pts]=rest.split('/');
  let mode='one',boxes,a,each=false;
  if(lhs.includes('~')){mode='any';each=true;boxes=lhs.split('~').map(Number);a=ans.split('~').map(Number)}
  else if(lhs.includes('-')){mode='any';boxes=lhs.split('-').map(Number);a=ans.split('-').map(Number)}
  else if(lhs.includes('+')){mode='all';boxes=lhs.split('+').map(Number);a=ans.split('+').map(Number)}
  else{boxes=[+lhs];a=[+ans]}
  const it={q,s,boxes,a,pts:+pts,mode};if(each)it.each=true;if(altS){const [x,y]=altS.split(':');it.alt={[+x]:+y}}items.push(it)});return items}

 st.subs=(st.sub||'').split(' ').filter(Boolean).map(t=>{const m=t.match(/^(\d)\.(\d)@(\d+):([\d.]+):(\w+)$/);return{st,q:+m[1],s:+m[2],pg:+m[3],y:+m[4],f:m[5],id:st.id+':'+m[1]+'.'+m[2]}})});

/*EXPL*/const EXPL={"k24:1.1": "配位結合は、一方の原子が「非共有電子対」を相手に提供してできる共有結合。\n① NH₄⁺：NH₃ の N の非共有電子対が H⁺ に配位。② H₃O⁺：H₂O の O の非共有電子対が H⁺ に配位。③ [Ag(NH₃)₂]⁺：NH₃ が Ag⁺ に配位（錯イオン）。\n④ ギ酸イオン HCOO⁻ は、ギ酸 HCOOH から H⁺ が取れただけで、配位結合はない → 正解", "k24:1.2": "液体：16 g ÷ 0.42 g/cm³ ≒ 38 cm³\n気体：16 g は 1.0 mol。V = nRT/P = 1.0 × 8.3×10³ × 300 ÷ 1.0×10⁵ = 24.9 L = 2.49×10⁴ cm³\n2.49×10⁴ ÷ 38 ≒ 6.5×10² 倍 → ①\n（cm³ と L の単位をそろえるのがポイント。1 L = 1000 cm³）", "k24:1.3": "すき間の大きさは ろ紙 ＞ セロハン（半透膜）。\n・砂：ろ紙も通れない。\n・トリプシン（コロイド粒子）：ろ紙は通れるが、セロハンは通れない。\n・グルコース（小さな分子）：どちらも通れる。\nろ紙を通過：グルコース・トリプシン、セロハンを通過：グルコース → ④", "k24:1.4": "ａ 誤りは ④。9×10⁴ Pa は 1.01×10⁵ Pa より低い。圧力が低いと蒸気圧曲線上の温度も低くなるので、水は 100 ℃ より「低い」温度で沸騰する（山の上でお湯が 100 ℃ 未満で沸く）。\n① 2×10² Pa は三重点の圧力（6.11×10² Pa）より低いので、液体にはならず昇華する。昇華曲線の温度は 0 ℃ より低い。正しい。\n② 固体と液体の境界線が左上がりなので、0 ℃ で圧力を上げると液体の領域に入り融解する。正しい。\n③ 三重点。正しい。\nｂ 正しいのは ③。図2で、12 ℃ の水の密度は約 0.9995 g/cm³、−4 ℃ の過冷却の水（破線）は約 0.9994 g/cm³ で、12 ℃ の方が大きい。\n① 0 ℃ の氷の密度（0.917）は水（0.9998）より小さいので、同じ 1 g なら氷の体積の方が「大きい」。\n② 氷の密度は温度が低いほど大きく、0 ℃ で最小。\n④ 4 ℃ より冷えた水は密度が小さくなるので、上に残る（下へは移動しない）。だから池は表面から凍る。\nｃ 6.0 kJ ÷ 6.0 kJ/mol = 1.0 mol（18 g）の氷がとける。\n残った氷：54 − 18 = 36 g\n0 ℃ の氷の密度は図2より 0.917 g/cm³。\n36 ÷ 0.917 ≒ 39 cm³ → ⑤", "k24:2.1": "吸熱反応では、生成物（NH₄NO₃ aq）の方がエネルギーが「高い」。\n下の NH₄NO₃(固) + aq から、上の NH₄NO₃ aq へ向かう上向きの矢印 → ①\n（周りから熱を吸収してエネルギーが上がるので、まわりが冷える＝冷却剤）\nポイント：エネルギー図は「上ほどエネルギーが高い」。\n発熱反応 → 生成物が下（エネルギーを放出して下がる）\n吸熱反応 → 生成物が上（まわりから熱を吸収して上がる）\n硝酸アンモニウムが水に溶けると冷たくなる（瞬間冷却パック）ので吸熱、と覚えておくと速い。", "k24:2.2": "③ 温度と圧力を一定のまま H₂ を加えると、反応物が増えるので平衡は右へ移動し、CO が増える → 正解\n① 正反応は吸熱反応なので、温度を下げると発熱の向き（左）へ移動し、CO は減る。\n② 左右とも気体の分子数は 2 なので、圧力を変えても平衡は移動しない。\n④ 圧力一定でアルゴンを加えると体積が増えて各気体の分圧が同じ割合で下がるが、分子数が左右で同じなので平衡は移動しない。", "k24:2.3": "反応物の合計の質量と、そのとき流れる電子の物質量を比べる。\nアルカリマンガン：2MnO₂ + Zn + 2H₂O（174 + 65 + 36 = 275 g）で電子 2 mol（Zn → Zn²⁺）\n→ 1 g 当たり 2/275 ≒ 0.0073 mol\n空気亜鉛：O₂ + 2Zn（32 + 130 = 162 g）で電子 4 mol\n→ 1 g 当たり 4/162 ≒ 0.025 mol\nリチウム：Li + MnO₂（6.9 + 87 = 93.9 g）で電子 1 mol\n→ 1 g 当たり 1/93.9 ≒ 0.011 mol\n大きい順に 空気亜鉛 ＞ リチウム ＞ アルカリマンガン → ④\n（空気亜鉛電池は正極の材料（O₂）を空気から取り入れるので軽くできる）", "k24:2.4": "ａ α ≪ 1 のとき Ka = cα² → α = √(Ka/c)。\nα は c の平方根に反比例する。c₀ で α₀ なら、4c₀ で α₀/2、c₀/4 で 2α₀。\nc → 0 で大きくなり、4c₀ で α₀/2 になる曲線 → ④\n（⑤ は α が c に反比例するグラフ（4c₀ で α₀/4）なので違う）\nｂ 2.5 mL 滴下したとき、HA 1.0×10⁻³ mol のうち 2.5×10⁻⁴ mol が中和されて A⁻ になる。\n残りの HA：7.5×10⁻⁴ mol、A⁻：2.5×10⁻⁴ mol（同じ溶液中なので物質量の比＝濃度の比）\nKa = [H⁺][A⁻]/[HA] = 8.1×10⁻⁵ × (2.5/7.5) = 2.7×10⁻⁵ mol/L → ②\nｃ 誤りは ④。10 mL で HA はすべて中和されているので、それ以上 NaOH を加えても中和反応は起こらない。[A⁻] が減るのは、溶液の体積が増えて「薄まる」から。\n① 陽イオン（Na⁺, H⁺）も陰イオン（A⁻, OH⁻）もすべて1価なので、電気的に中性なら数は等しい。正しい。\n② 水のイオン積は温度が一定なら一定。正しい。\n③ 中和で H⁺ が減ると、HA ⇄ H⁺ + A⁻ の平衡が右へ移り、A⁻ が増える。正しい。", "k24:3.1": "誤りは ① と ③。\n① ナトリウムはエタノールと反応して水素を出すので、エタノールには保存できない。灯油（石油）の中に保存する。\n③ 濃硫酸に水を加えると、激しく発熱して水が沸騰し飛び散る。希釈するときは「水に濃硫酸を少しずつ」加える。\n② 強塩基が皮膚についたら、すぐに大量の水で洗う。正しい。④ 濃硝酸は光で分解するので褐色びんに入れる。正しい。⑤ 有毒な H₂S はドラフト内で扱う。正しい。", "k24:3.2": "ハロゲンの性質は、周期表の下へいくほど次のように変わる。At は I のさらに下。\n・融点・沸点は高くなる（分子間力が大きくなる）→ ① 正しい\n・水に溶けにくくなる → ② 正しい\n・AgCl・AgBr・AgI と同じく AgAt も沈殿 → ③ 正しい\n・酸化力は小さくなる（F₂ ＞ Cl₂ ＞ Br₂ ＞ I₂ ＞ At₂）\n誤りは ④。Br₂ は At₂ より酸化力が強いので、2At⁻ + Br₂ → At₂ + 2Br⁻ の酸化還元反応が起こる。", "k24:3.3": "ア ステンレス鋼は、Fe にクロム Cr やニッケル Ni を加えた合金。Cr が表面に緻密な酸化物の膜をつくり、さびにくい → ③\nイ トタンは、鋼板に亜鉛 Zn をめっきしたもの。傷がついても、イオン化傾向の大きい Zn が先に溶けて鉄を守る → ④\n（スズ Sn をめっきしたものはブリキ）", "k24:3.4": "ａ 酸化数で見る。\nNi：NiS 中で +2 → NiCl₂ 中で +2 → 酸化も還元もされない\nS：NiS 中で −2 → 単体 S で 0 → 酸化される\n（Cu は CuCl₂ の +2 → CuCl の +1 で還元される）→ ③\nｂ 式⑴：NiS + 2CuCl₂ → NiCl₂ + 2CuCl + S\n式⑵：2CuCl + Cl₂ → 2CuCl₂\n足し合わせると CuCl₂ は消えて：NiS + Cl₂ → NiCl₂ + S\nCuCl₂ はくり返し使われるだけなので、Cl₂ は NiS と同じ物質量だけ使われる。\nNiS（式量 91）：36.4×10³ g ÷ 91 = 400 mol → Cl₂ 400 mol → ⑤\n（CuCl₂ の 40.5 kg は答えには関係しない）\nｃ 陽極で Cl₂ が n(Cl₂) mol 出たなら、流れた電子は 2n(Cl₂) mol。\n陰極ではその電子が Ni と H₂ に分かれて使われる：2n(Cl₂) = 2n(Ni) + 2n(H₂)\n→ n(Ni) = n(Cl₂) − n(H₂)\n気体の物質量は n = PV/RT なので\nw = M × P(V_Cl₂ − V_H₂)/RT → ②", "k24:4.1": "エチレン 2 mol と O₂ 1 mol から A が 2 mol できるので、A は C₂H₄ に O が1つ加わった C₂H₄O。\nこの条件（PdCl₂・CuCl₂ 触媒での酸化、ヘキスト・ワッカー法）でできるのはアセトアルデヒド CH₃CHO → ③\n① エタノールは C₂H₆O、② ジメチルエーテルも C₂H₆O、④ 酢酸は C₂H₄O₂ で、分子式が合わない。", "k24:4.2": "誤りは ①。デンプンのうち、枝分かれの多いアミロペクチンは水（温水にも）に溶けにくい。温水に溶けるのは、枝分かれのないアミロース。\n② アクリル繊維はアクリロニトリルが主成分。正しい。\n③ 加硫。正しい。\n④ レーヨンはセルロースを溶かして繊維にもどした再生繊維。正しい。", "k24:4.3": "このトリペプチドは、アミノ酸3つ（チロシン・アラニン・システイン）がつながったもの。\nア ニンヒドリン反応：–NH₂（アミノ基）があれば紫色。末端に –NH₂ がある → 示す\nイ キサントプロテイン反応：ベンゼン環があれば黄色→橙黄色。チロシンのベンゼン環がある → 示す\nウ ビウレット反応：ペプチド結合が2つ以上（トリペプチド以上）で赤紫色。トリペプチドなのでペプチド結合が2つある → 示す\nア・イ・ウすべて → ⑦", "k24:4.4": "ａ 誤りは ②。サリシンのグルコース部分は、1位の –OH がサリチルアルコールとグリコシド結合しているので、環が開いてアルデヒド基になることができない。だから還元性がなく、銀鏡反応を示さない。\n① グリコシド結合は酸で加水分解される。正しい。\n③ コルベ・シュミット反応。正しい。\n④ サリチル酸メチル（湿布薬）。正しい。\nｂ β-ラクタム環は、N と C 3つ（そのうち1つが C=O）からなる四員環。\n–NH₂ と –COOH の間に炭素が2つある化合物なら、N と C=O が結合（脱水）して四員環ができる。\nH₂N–CH₂–CH₂–COOH（β-アミノ酸）→ ②\n（① は三員環、③ は五員環、④ は六員環になる）\nｃ トルエン →（濃硝酸・濃硫酸：ニトロ化）→ p-ニトロトルエン（A）\n→（KMnO₄：側鎖の –CH₃ を –COOH に酸化）→ p-ニトロ安息香酸（B）\n→（Sn・HCl：–NO₂ を –NH₂ に還元）→ p-アミノ安息香酸（C）\n→（エタノール・濃硫酸：エステル化）→ p-アミノ安息香酸エチル\n化合物Ｂは O₂N–C₆H₄–COOH → ⑤\n（先に還元して –NH₂ にすると、KMnO₄ でアミノ基も酸化されてしまうので、この順番にする）", "k24:5.1": "図1は原点を通る直線。信号強度 100 ↔ 5.0×10⁻⁸ g なので、信号強度 10 ↔ 5.0×10⁻⁹ g（尿 3.0 mL 中）。\n尿 90 mL は 3.0 mL の 30 倍なので、5.0×10⁻⁹ × 30 = 1.5×10⁻⁷ g → ④", "k24:5.2": "実験Ⅰで取り分けた 100 mL には、X の Ag の半分が入っている。その物質量を n とする。\n¹⁰⁷Ag：0.500n、¹⁰⁹Ag：0.500n\n実験Ⅱで ¹⁰⁷Ag を 5.00×10⁻³ mol 加えると、¹⁰⁷Ag の割合が 75.0 % になった。\n(0.500n + 5.00×10⁻³) ÷ (n + 5.00×10⁻³) = 0.750\n→ 0.250n = 1.25×10⁻³ → n = 5.00×10⁻³ mol（100 mL 中）\nX 全体（200 mL）ではその2倍：1.00×10⁻² mol → ③", "k24:5.3": "ａ CH₃Cl の分子イオンは、³⁵Cl なら 12 + 3 + 35 = 50、³⁷Cl なら 52。\n³⁵Cl：³⁷Cl ≒ 3：1 なので、50 の強度が 100 なら 52 は約 33。\nさらに H が取れた断片イオン（CH₂Cl⁺ の 49、CHCl⁺ の 48、CCl⁺ の 47）が小さく出る。\n50 が最大で、52 がその約 1/3 → ④\n（① ② は ³⁷Cl を考えていない。⑤ は 1：1、③ ⑥ は 52 の方が大きくて逆）\nｂ 正確な相対質量を計算する。\nCO：12 + 15.995 = 27.995\nN₂：14.003 × 2 = 28.006\nC₂H₄：12 × 2 + 1.008 × 4 = 28.032\n小さい順に ア（27.995）＝CO⁺、イ（28.006）＝N₂⁺、ウ（28.032）＝C₂H₄⁺ → ②\nｃ 破線の2か所（CH₃ と C=O の間、C=O と CH=CH₂ の間）で切れてできるイオンを考える。\n分子イオン CH₃COCH=CH₂⁺：70\nCH₃⁺：15、COCH=CH₂⁺：55\nCH₃CO⁺：43、CH=CH₂⁺：27\n15・27・43・55・70 にピークがある → ①\n（② ④ の 60、③ ④ の 38 にあたるイオンはできない）", "k24t:1.1": "ア 塩基性を示す塩：弱酸と強塩基からできた塩 → 硫化ナトリウム（H₂S と NaOH）、乳酸ナトリウム（乳酸と NaOH）\nイ 二重結合をもたない：乳酸ナトリウムは –COO⁻（C=O）をもつので ×\n両方に当てはまるのは硫化ナトリウム Na₂S → ②\n① 塩化アンモニウムは弱塩基と強酸の塩で酸性。④ 塩化カルシウムは強酸と強塩基の塩で中性。", "k24t:1.2": "誤りは ②。HCl は極性分子で、無極性の F₂ より分子間力が強いので沸点が高い。理由は「分子の極性が大きいと分子間力が強くはたらく」が正しい。\n① 構造が似た分子では、分子量が大きいほどファンデルワールス力が強く沸点が高い。正しい。\n③ H₂O は水素結合のため、同族の水素化合物の中で沸点がとび抜けて高い。正しい。\n④ 不揮発性の溶質を溶かすと蒸気圧が下がり、沸点が上がる（沸点上昇）。正しい。", "k24t:1.3": "物質量が一定なので、ボイル・シャルルの法則 P₁V₁/T₁ = P₂V₂/T₂ を使う。\n体積を 1/3 にし、温度が 280 K → 420 K（1.5倍）になったので\nP₂ = 1.0×10⁵ × 3 × 1.5 = 4.5×10⁵ Pa → ③\nポイント：P は V に反比例、T に比例。\n・体積 1/3 → 圧力 3倍\n・温度 280 K → 420 K で 420/280 ＝ 1.5倍 → 圧力 1.5倍\nあわせて 3 × 1.5 ＝ 4.5倍。温度は必ず絶対温度（K）で比べる。", "k24t:1.4": "ａ 誤りは ④。メタノールは –OH をもち水と水素結合をつくるので、水とはどんな割合でも混ざり合う。二層には分かれない。\n① ヘキサンは C と H だけの無極性分子。② メタノールは極性分子。③ ヘキサンは水にほとんど溶けない。いずれも正しい。\nｂ 下層は「メタノールにヘキサンが飽和した溶液」。表1より 20 ℃ ではメタノール 100 g にヘキサンが 59 g 溶ける。\n質量パーセント濃度 = 59 ÷ (100 + 59) × 100 ≒ 37 % → ③\nｃ 10 ℃ では、メタノール 100 g にヘキサンは 44 g まで溶ける。\nメタノール 10 g なら 4.4 g まで溶けて均一な溶液のまま。\n1.0 g ずつ加えると、4.0 g までは溶けきり、5.0 g で 4.4 g を超えて初めて二層に分かれる → ⑤", "k24t:2.1": "v = k[H₂][Br₂]^(1/2) で、それぞれ何倍になるかを比べる。\n① [H₂] を2倍 → 2倍\n② [Br₂] を2倍 → √2 ≒ 1.4倍\n③ 物質量・温度が同じで圧力を2倍 → 体積が半分になり、[H₂] も [Br₂] も2倍 → 2 × √2 ≒ 2.8倍\n④ k を2倍 → 2倍\nいちばん大きいのは ③", "k24t:2.2": "変化した物質量を見る。\nX：1.0 → 0.60（0.40 mol 減少）\nY：1.0 → 0.80（0.20 mol 減少）\nZ：0 → 0.40（0.40 mol 増加）\n変化量の比が係数の比なので a：b：c = 0.40：0.20：0.40 = 2：1：2\na/b = 2.0 → ⑦", "k24t:2.3": "BaSO₄ の飽和水溶液の濃度が 1×10⁻⁵ mol/L なので、溶解度積は Ksp = (1×10⁻⁵)² = 1×10⁻¹⁰ (mol/L)²。\n混合後の体積：900 + 100 = 1000 mL = 1.00 L\nBa²⁺：10.4 mg ÷ 208 = 5.0×10⁻⁵ mol、SO₄²⁻：142 mg ÷ 142 = 1.0×10⁻³ mol\nSO₄²⁻ の方がずっと多いので、Ba²⁺ はほとんど沈殿し、[SO₄²⁻] ≒ 1.0×10⁻³ mol/L のまま。\n[Ba²⁺] = 1×10⁻¹⁰ ÷ 1.0×10⁻³ = 1×10⁻⁷ mol/L → ②", "k24t:2.4": "ａ 銅の電解精錬では、粗銅を陽極（ア）、純銅を陰極（イ）にする。\n陽極では Cu とイオン化傾向の大きい Zn がイオンになって溶け出し、Zn²⁺ は溶液中に残る（エ＝Zn）。\nイオン化傾向の小さい Ag は溶けずに陽極の下にたまる（陽極泥、ウ＝Ag）。→ ④\nｂ Q₀ で Cu が 16 g ＝ 16/64 = 0.25 mol 析出。Cu²⁺ + 2e⁻ → Cu なので、Q₀ は電子 0.50 mol 分。\nAl³⁺ + 3e⁻ → Al なので、電子 0.50 mol で Al は 0.50/3 mol → 27 × 0.50/3 = 4.5 g。\n2Q₀ では 9.0 g。原点を通り、2Q₀ で約 9 g の直線 → ①\nｃ 電気量：5.00×10⁻² A × 193 s = 9.65 C → 電子 9.65 ÷ 9.65×10⁴ = 1.00×10⁻⁴ mol\n2I⁻ → I₂ + 2e⁻ なので、I₂ は 5.00×10⁻⁵ mol。\nI₂ と H₂O は同じ物質量で反応するので、H₂O も 5.00×10⁻⁵ mol → ①", "k24t:3.1": "Ⅱ 光の屈折率が大きいガラスは鉛ガラス（クリスタルガラス）→ ア＝Pb\nⅠ 酸にも塩基にも溶けるのは両性金属の Sn と Pb → イ＝Sn\nⅢ ケイ素は、二酸化ケイ素をコークス（炭素）で還元してつくる：SiO₂ + 2C → Si + 2CO → ウ＝Si、エ＝C\nPb・Sn・Si・C → ⑧", "k24t:3.2": "ア 塩酸を加えると PbCl₂ だけが沈殿し、Fe²⁺ は残る → 分けられる\nイ 過剰のアンモニア水で Fe(OH)₃ は沈殿、Zn²⁺ は [Zn(NH₃)₄]²⁺ になって溶ける → 分けられる\nウ 炭酸アンモニウムを加えると CaCO₃ も BaCO₃ も沈殿する → 片方だけにできない\n→ ウ → ③\n（Ca²⁺ と Ba²⁺ を分けるなら、希硫酸で BaSO₄ だけ沈殿させる方法などがある）", "k24t:3.3": "ａ Co₃O₄：0.964 ÷ 241 = 4.00×10⁻³ mol → Co は3倍の 1.20×10⁻² mol\nCo の質量：1.20×10⁻² × 59 = 0.708 g\n含有率：0.708 ÷ 3.01 × 100 ≒ 23.5 % → ③\nｂ 誤りは ②。中和点の水溶液には (NH₄)₂SO₄ と Na₂SO₄ が含まれる。NH₄⁺ が加水分解して H⁺ を出すので、水溶液は弱い「酸性」になる。\nだから変色域が酸性側にあるメチルオレンジを使う（③ は正しい）。\n① 入れる希硫酸の物質量は決まっているので、三角フラスコがぬれていても結果は変わらない。正しい。\n④ NaOH 水溶液が空気中の CO₂ を吸うと濃度が変わるので、ソーダ石灰管で防ぐ。正しい。\nｃ 希硫酸の H⁺：1.00 × 35.0/1000 × 2 = 7.00×10⁻² mol\nNaOH で中和した分：1.00 × 20.00/1000 = 2.00×10⁻² mol\nNH₃ が中和した分：7.00×10⁻² − 2.00×10⁻² = 5.00×10⁻² mol\nCo³⁺ 1.00×10⁻² mol に対して NH₃ 5.00×10⁻² mol → 1つの Co³⁺ に NH₃ 5個 → ⑤", "k24t:4.1": "誤りは ⑤。ベンゼンスルホン酸は強酸で、カルボン酸の安息香酸より「強い」酸。\n（酸の強さ：スルホン酸 ＞ カルボン酸 ＞ 炭酸 ＞ フェノール）\n① クメン法の最初の反応。② フェノールは臭素と置換して 2,4,6-トリブロモフェノールの白色沈殿。③ アセチレン3分子が重合してベンゼン。④ アニリンはさらし粉で赤紫色。いずれも正しい。", "k24t:4.2": "誤りは ④。イソプレン CH₂=C(CH₃)–CH=CH₂ が 1,4 位で付加重合すると、まん中の 2・3 位の間に新しく C=C ができ、–CH₂–C(CH₃)=CH–CH₂– となる。繰り返し単位ごとに二重結合が1つ残る（だから加硫ができる）。\n① 合成高分子の重合度はばらつきがあり、分子量は平均で表す。② 結晶部分と非結晶部分がある。③ ポリメタクリル酸メチル（アクリル樹脂）は透明で、水槽や風防に使われる。いずれも正しい。", "k24t:4.3": "ａ エステル C₆H₅–COO–(CH₂)₄–C₆H₅ を NaOH で加水分解すると、\n安息香酸ナトリウム C₆H₅COONa（塩なので水に溶ける）と、アルコール C₆H₅–(CH₂)₄–OH（水に溶けにくい）ができる。\n1回目：エーテルを加えると、アルコールＢはエーテル層＝上層①へ。安息香酸ナトリウムは水層＝下層①に残る。\n2回目：下層①に塩酸を加えると安息香酸（カルボン酸Ａ）になり、水に溶けにくくなってエーテル層＝上層②へ。\nＡ：上層②、Ｂ：上層① → ③\n（ジエチルエーテルは水より密度が小さいので上の層になる）\nｂ C₁₀H₁₄O で、フェニル基をもつ第一級アルコール（–CH₂OH をもつ）を考える。\nC₆H₅– と –CH₂OH を除いた残りは C₃H₆。炭素4つの第一級アルコール（1-ブタノール・2-メチル-1-プロパノール）の H 1つを C₆H₅ にかえる形で数える。\n・HOCH₂–CH(C₆H₅)–CH₂–CH₃ → 不斉炭素あり ○\n・HOCH₂–CH₂–CH(C₆H₅)–CH₃ → 不斉炭素あり ○\n・HOCH₂–CH₂–CH₂–CH₂–C₆H₅（アルコールＢ自身）→ なし\n・HOCH₂–C(CH₃)₂–C₆H₅ → なし\n・HOCH₂–CH(CH₃)–CH₂–C₆H₅ → 不斉炭素あり ○\n不斉炭素原子をもつのは 3 つ → ③", "k24t:4.4": "ａ 誤りは ②。硬水には Ca²⁺ や Mg²⁺ が多く、セッケン（脂肪酸ナトリウム）と結びついて水に溶けにくい塩をつくるので、洗浄力が下がる（合成洗剤は硬水でも下がりにくい）。\n① 表面張力を下げて繊維にしみこむ。③ 陽イオン界面活性剤は柔軟剤・リンスに使う。④ 乳化作用。いずれも正しい。\nｂ ステアリン酸の質量：0.568 g/L × 0.100×10⁻³ L = 5.68×10⁻⁵ g\n物質量：5.68×10⁻⁵ ÷ 284 = 2.00×10⁻⁷ mol\n分子の数：2.00×10⁻⁷ × 6.0×10²³ = 1.20×10¹⁷ 個\n1分子の面積：252 ÷ 1.20×10¹⁷ = 2.1×10⁻¹⁵ cm² → ①", "k24t:5.1": "誤りは ③。ポリ酢酸ビニルは、酢酸ビニル CH₂=CH–OCOCH₃ の C=C が開いてつながる「付加重合」でできる。縮合重合ではない。\n① ナイロン6 は ε-カプロラクタムの開環重合。② ポリスチレンはスチレンの付加重合。④ フェノール樹脂はフェノールとホルムアルデヒドの付加縮合。いずれも正しい。", "k24t:5.2": "ａ pH 6.0 での電荷を考える。\nＡ（アラニン）：等電点が 6.0 なので電荷は全体で 0 → 動かない\nＢ（グルタミン酸）：側鎖にも –COOH があり、等電点は約 3.2（酸性アミノ酸）。pH 6.0 では –COO⁻ が多く、負に帯電 → 陽極側へ動く\nＣ（Ｂが2分子結合）：–COO⁻ が3つ、–NH₃⁺ が1つで、Ｂより負の電荷が大きい → 陽極側へもっと遠くまで動く\nＡはその場、Ｂは陽極側、Ｃはさらに陽極側 → ④\nｂ グリシン H₂N–CH₂–COOH 2分子で、–NH₂ と –COOH が2か所で脱水縮合（アミド結合）すると、\n–NH–CH₂–CO–NH–CH₂–CO– が輪になった六員環（2,5-ジケトピペラジン）ができる。\n環の中で N と C=O が交互に、CH₂ をはさんで並ぶ形 → ①\n（② ③ ④ は原子のつながり方がグリシン2分子からはできない形）", "k24t:5.3": "ａ ナイロン68 は m = 6、n = 8。\n4 ÷ (6 + 8 + 2) = 4 ÷ 16 = 0.25\n図2の直線で横軸 0.25 の融点を読むと約 245 ℃ → ③\nｂ 読み取れないのは ④。図2はナイロンの種類（m・n）と融点の関係しか示しておらず、同じナイロンで重合度を変えたデータはない。\n① m が同じでも n が変われば 4/(m+n+2) が変わり、融点も変わる。読み取れる。\n② 同じ長さ当たりのアミド結合が多い ⇔ m+n が小さい ⇔ 4/(m+n+2) が大きい ⇔ 融点が高い。読み取れる。\n③ m+n が大きいほど 4/(m+n+2) が小さく、融点は低い。読み取れる。", "k25:1.1": "イオン結晶は、陽イオンと陰イオンがクーロン力（静電気的な引力）で結びついた結晶。金属元素と非金属元素の化合物が多い。\n② 酸化マグネシウム MgO は Mg²⁺ と O²⁻ からなるイオン結晶 → 正解\n① p-ジクロロベンゼンは分子結晶、③ ダイヤモンドは共有結合の結晶、④ アルミニウムは金属結晶。", "k25:1.2": "Ⅰ 同じ温度・圧力の気体では、体積の比＝物質量の比。混合後の分圧の比も物質量の比に等しいので、体積比と同じになる。正しい。\nⅡ 高圧では分子どうしが近づき、分子自身の体積の分だけ実在気体の体積が理想気体より大きくなる。正しい。\nⅢ 高温では分子の運動が激しくなり、分子間力の影響が相対的に小さくなるので理想気体に近づく。正しい。\n正・正・正 → ①", "k25:1.3": "ヘンリーの法則：溶ける気体の物質量は、その気体の圧力に比例する。\n水 500 mL（0.500 L）に、1.0×10⁵ Pa で溶ける CO₂ は 4.0×10⁻² × 0.500 = 2.0×10⁻² mol。\n蓋を閉めた後（1.0×10⁵ Pa）に溶けている CO₂ は 2.0×10⁻² mol。\n緩める前は、それより 0.060 mol 多く溶けていたので 0.020 + 0.060 = 0.080 mol。\n0.080 は 0.020 の4倍なので、圧力も4倍 → 4.0×10⁵ Pa → ⑤", "k25:1.4": "誤りは ②。液体の中に液体の粒子が分散したもの（牛乳など）は「乳濁液（エマルション）」。懸濁液（サスペンション）は、液体の中に固体の粒子が分散したもの（泥水など）。\n① 親水コロイドに多量の電解質を加えて沈殿させるのが塩析。正しい。\n③ 電気泳動では、粒子は自分と反対の電荷の電極へ動く。正しい。\n④ ブラウン運動の原因。正しい。\n⑤ チンダル現象。正しい。", "k25:1.5": "ａ 沸騰は「溶液の蒸気圧＝外の圧力」になったときに起こる。\nNaCl 水溶液の沸点上昇度が 8 K なので、90 ℃ で沸騰するこの溶液の蒸気圧は、90 − 8 = 82 ℃ の純水の蒸気圧と同じ。\n図2で 82 ℃ の蒸気圧を読むと約 5.1×10⁴ Pa。容器B内の圧力はこれに等しい → ①\n（② 7.0×10⁴ は 90 ℃ の純水の値で、沸点上昇を考えていない）\nｂ 水が移動しなくなるのは、溶液側にかけた圧力の差が溶液の浸透圧と等しくなったとき。\n圧力の差：3.1×10⁶ − 1.0×10⁵ = 3.0×10⁶ Pa\nNaCl → Na⁺ + Cl⁻ なので粒子の濃度は NaCl の2倍。平衡時の NaCl の濃度を C (mol/L) とすると\n3.0×10⁶ = 2C × 8.3×10³ × 300 → C ≒ 0.602 mol/L\nNaCl は 0.50 × 10 = 5.0 mol で変わらないので、溶液の体積は 5.0 ÷ 0.602 ≒ 8.3 L。\n移動した水は 10 − 8.3 = 1.7 L → ①", "k25:2.1": "化学発光は、化学反応で生じたエネルギーが光として出る現象。\n③ ネオンサインは、ネオンなどの気体に電圧をかけて放電させて光らせるもので、化学反応ではない → 正解\n① ルミノール反応、② ケミカルライト（シュウ酸エステルと過酸化水素の反応）、④ ホタルの光（ルシフェリンの酸化）はどれも化学発光。", "k25:2.2": "負極：Cd → Cd(OH)₂ で、Cd 1 mol 当たり OH 2つ分（17 × 2 = 34 g）質量が増える。\n1.7 ÷ 34 = 0.050 mol の Cd が反応 → 流れた電子は 0.050 × 2 = 0.10 mol。\n正極：電子 1 mol 当たり H₂O 1 mol が消費される → H₂O 0.10 mol（負極では水は消費されない）。\n0.10 × 18 = 1.8 g → ②\n（全体の反応 Cd + 2NiO(OH) + 2H₂O → Cd(OH)₂ + 2Ni(OH)₂ からも、電子2個で水2個と分かる）", "k25:2.3": "1−α≒1 のとき、弱酸の [H⁺] = √(c·Ka)。\n体積を k 倍にすると濃度 c は 1/k になるので、[H⁺] は 1/√k 倍。\npH = 4.0 + ½ log k\n5V₀ → 4.0 + 0.35 ≒ 4.35、10V₀ → 4.5、20V₀ → 4.0 + 0.65 ≒ 4.65\n初めにゆるやかに上がり、20V₀ でも 4.7 弱にとどまるグラフ → ④\n① 弱酸を薄めても pH は 7 を超えないし、こんなに急に 7 にはならない。② 一定にはならない。③ は上がりすぎ（20V₀ で 5.3 になるのは強酸のように pH = 4 + log k となる場合）。", "k25:2.4": "ａ 気体の分圧 P = (n/V)RT = [濃度]×RT なので、Kp = Kc × (RT)^(生成物の係数の和 − 反応物の係数の和)。\nN₂ + 3H₂ ⇄ 2NH₃ では 2 − (1+3) = −2。\nKp = Kc(RT)⁻² = Kc / (RT)² → ⑤\nｂ NH₃ が 3.0 mol できたとき、N₂ は 1.5 mol、H₂ は 4.5 mol 減る。\n平衡時：N₂ 0.5 mol、H₂ 1.5 mol、NH₃ 3.0 mol、合計 5.0 mol\nNH₃ の体積百分率 = 3.0 ÷ 5.0 × 100 = 60 %\n図1の 1.0×10⁸ Pa の曲線で 60 % になる温度を読むと約 490 ℃ → ③\nｃ 温度を上げると2つのことが起こる。\n・反応速度が大きくなる → 立ち上がりが急になり、早く平衡に達する。\n・この反応は発熱反応（図1でも高温ほど NH₃ が少ない）→ 平衡は左へ移り、NH₃ の割合は小さくなる。\n「速く立ち上がって、低いところで平らになる」のは ④ → 正解\n① ② は平衡時の割合が大きい・同じでまちがい。③ ⑤ は立ち上がりが遅くまちがい。", "k25:3.1": "誤りは ②。ヘキサシアニド鉄(Ⅲ)酸カリウム K₃[Fe(CN)₆] で濃青色の沈殿ができるのは「鉄(Ⅱ)イオン Fe²⁺」。Fe³⁺ では沈殿はできない（褐色の溶液になる）。\n（Fe³⁺ の検出は K₄[Fe(CN)₆] で濃青色沈殿、またはチオシアン酸カリウムで血赤色）\n① Cu(OH)₂ の青白色沈殿ができる。正しい。\n③ 塩基性〜中性では MnO₄⁻ → MnO₂（酸性では Mn²⁺）。正しい。\n④ [Ag(NH₃)₂]⁺ ができて溶ける。正しい。", "k25:3.2": "誤りは ③。シリカゲルは、水ガラスに塩酸を加えてできたケイ酸を、加熱・乾燥させてつくる。水ガラスをそのまま乾燥させたものではない。\n① SiO₂ + 2NaOH → Na₂SiO₃ + H₂O で、NaOH でもできる。正しい。\n② Na₂SiO₃：(+1)×2 + x + (−2)×3 = 0 → x = +4。正しい。\n④ 弱酸の塩 + 強酸 → 弱酸。ケイ酸ができる。正しい。", "k25:3.3": "まず気体を決める。\nア 銅 + 濃硝酸 → 二酸化窒素 NO₂、イ 銅 + 希硝酸 → 一酸化窒素 NO\nウ ホタル石 CaF₂ + 濃硫酸 → フッ化水素 HF、エ 酸素の無声放電 → オゾン O₃\n誤りは ②。NO は水に溶けにくく、空気中の O₂ とすぐ反応して NO₂ になるので「水上置換」で集める。\n① NO₂ は水と反応して硝酸などができ、酸性になる。正しい。\n③ フッ化水素酸はガラス（SiO₂）を溶かすので、ポリエチレンの容器に入れる。正しい。\n④ O₃ は酸化力が強く、KI を I₂ に酸化してデンプンを青紫色にする。正しい。", "k25:3.4": "ａ 誤りは ③。I⁻ から I₂ をつくるには I⁻ を「酸化」する必要がある。塩化スズ(Ⅱ) SnCl₂ は還元剤なので、H₂O₂ の代わりにならない。\n① H₂O₂ は I⁻ から電子を受け取る酸化剤。正しい。\n② I₂ は無極性なので、水よりヘキサンによく溶けて抽出される。正しい。\n④ Cl₂ は I₂ より酸化力が強いので、2I⁻ + Cl₂ → I₂ + 2Cl⁻。正しい。\nｂ 電子のやりとりで考える。\nI：NaIO₃ の +5 → I₂ の 0。I 1個で電子5個を受け取る。NaIO₃ 2 mol（I₂ 1 mol）で電子 10 mol。\nS：NaHSO₃ の +4 → +6。NaHSO₃ 1 mol で電子 2 mol を出す。\n電子 10 mol を出すには NaHSO₃ が 5 mol 必要 → ⑤\n（2NaIO₃ + 5NaHSO₃ → 3NaHSO₄ + 2Na₂SO₄ + H₂O + I₂ で、原子の数も合う）\nｃ I₂：25.4 kg = 25400 g ÷ 254 = 100 mol\n式⑸ 2CuI + O₂ → 2CuO + I₂ より CuI は 200 mol、式⑷ より NaI : CuI = 1 : 1 なので NaI も 200 mol。\n濃度 = 200 ÷ 2.50×10⁵ = 8.0×10⁻⁴ mol/L → 8・0・4", "k25:4.1": "誤りは ②。フェノールは炭酸より弱い酸なので、炭酸水素ナトリウムとは反応せず、CO₂ は出ない（CO₂ が出るのはカルボン酸）。\n① –OH をもつので Na と反応して H₂ が出る。正しい。\n③ エタノールを濃硫酸で約 130〜140 ℃ に加熱すると、分子間で脱水してジエチルエーテル。正しい。\n④ CH₃CO– をもつのでヨードホルム反応を示す。正しい。\n⑤ フェノールはアセチル化されて酢酸フェニルになる。正しい。", "k25:4.2": "分子量 179.0 は 86.0 + 93.0 とちょうど同じ。つまり何も取れずに、アニリンの N–H がアクリル酸メチルの C=C にそのまま「付加」した。\n選択肢を条件で確かめる。\n① ② は C=C が残っていて、分子量が H₂ 分少ない（177）。×\n③ はカルボン酸、④ はアミドで、エステル結合をもたない。×\n⑥ は CH₃–CH(NH–C₆H₅)– の炭素が不斉炭素原子。×\n条件Ⅰ〜Ⅲをすべて満たすのは C₆H₅–NH–CH₂–CH₂–COOCH₃ → ⑤", "k25:4.3": "誤りは ④。フルクトースとグルコースはどちらも C₆H₁₂O₆ だが、グルコースはアルデヒド基（アルドース）、フルクトースはケトン基（ケトース）をもち、原子のつながり方が違う「構造異性体」。立体異性体ではない。\n① α-ヘリックスや β-シートは、ペプチド結合の C=O と N–H の水素結合でできる。正しい。\n② 結晶中のアミノ酸は –NH₃⁺ と –COO⁻ をもつ双性イオン。正しい。\n③ α形・β形の環状構造2種類と、鎖状構造1種類の合計3種類。正しい。", "k25:4.4": "ａ 誤りは ⑤。ポリアセチレンは –CH=CH–CH=CH– のように「二重結合と単結合」が交互に並んだ高分子（電気を通すことで知られる）。三重結合ではない。\n① CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂。正しい。② 酸素アセチレン炎は約3000 ℃で溶接に使う。正しい。③ ビニルアルコールを経てアセトアルデヒドになる。正しい。④ HCN の付加でアクリロニトリル（アクリル繊維の原料）。正しい。\nｂ 酢酸ビニル CH₂=CH–OCOCH₃ の C=C がつながるのは「付加重合」（反応ア → ⑥）。\nできる化合物Ｂはポリ酢酸ビニル –[CH₂–CH(OCOCH₃)]ₙ–（→ ⑨）。\nこれのエステル部分を NaOH などで「加水分解」（けん化）すると –OH になり、ポリビニルアルコールができる（反応イ → ①）。\n（ビニルアルコール ⓪ は不安定でアセトアルデヒドに変わるので、直接重合させることはできない。だから酢酸ビニルを経由する）\nｃ PVA の繰り返し単位（–CH₂–CH(OH)–、44.0）：88.0 ÷ 44.0 = 2.00 mol → ヒドロキシ基も 2.00 mol。\nアセタール化1か所では、OH 2つとブチルアルデヒド1分子から水1分子が取れる。\n質量の増加は 1か所当たり 72.0 − 18.0 = 54.0 g/mol。\n増えた質量：120.4 − 88.0 = 32.4 g → 32.4 ÷ 54.0 = 0.600 mol のアセタール化\n使われた OH は 0.600 × 2 = 1.20 mol → 1.20 ÷ 2.00 × 100 = 60 % → ③", "k25:5.1": "沸点が低い順に、石油ガス → ナフサ（粗製ガソリン）→ 灯油 → 軽油 → 重油。\n分子が小さい（炭素数が少ない）ほど沸点が低く、上の段で取り出される。\nA（30〜180 ℃）ナフサ、B（180〜250 ℃）灯油、C（250〜350 ℃）軽油 → ③\n理由：石油は炭素数の違う炭化水素の混合物。分留塔の下で加熱し、沸点の高い成分（大きな分子）ほど下の段で液体になって取り出される。\n上から順に「ガス → ナフサ → 灯油 → 軽油 → 重油」と並ぶ、と覚えておく。", "k25:5.2": "ベンゼンに H₂ を付加させる（3 mol 付加）と、二重結合のないシクロヘキサン C₆H₁₂ ができる → 化合物Ｄ。\n（①〜③ の D は H₂ が 2 mol しか付加していないシクロヘキサジエン）\nε-カプロラクタムは、–CO–(CH₂)₅–NH– が輪になった化合物。開環重合すると –[CO–(CH₂)₅–NH]ₙ– のナイロン6 → 化合物Ｅ。\n（⑤ の E はアジピン酸とヘキサメチレンジアミンからできるナイロン66）\nD シクロヘキサン、E ナイロン6 → ④", "k25:5.3": "ａ VO²⁺ は V と O からなるイオンで、全体の電荷が +2。\nx + (−2) = +2 → x = +4 → ④\nｂ ナフタレンを V₂O₅ を触媒に酸化すると、片方のベンゼン環が壊れて、フタル酸を経て無水フタル酸ができる → ①\n（⑤ の無水マレイン酸は、ベンゼンを V₂O₅ で酸化したときにできる）\nｃ 反応エンタルピー ＝（生成物の生成エンタルピーの和）−（反応物の生成エンタルピーの和）。単体は 0。\n経路Ⅰ：V₂O₅ + 5Ca → 2V + 5CaO\nΔHⅠ = 5×(−636) − (−1550) = −3180 + 1550 = −1630 kJ\n経路Ⅱ：\nV₂O₅ + 2H₂ → V₂O₃ + 2H₂O：(−1220) + 2×(−286) − (−1550) = −242 kJ\nV₂O₃ + 3Ca → 2V + 3CaO：3×(−636) − (−1220) = −688 kJ\nΔHⅡ = −242 + (−688) = −930 kJ\nどちらも負で、ΔHⅠ（−1630）＜ ΔHⅡ（−930）＜ 0 → ①\n（出発物質と最終生成物が違う（H₂O ができる）ので、ヘスの法則でも同じ値にはならない）\nｄ 滴定に使った EDTA：1.00×10⁻² × 4.00/1000 = 4.00×10⁻⁵ mol\nVO²⁺ と EDTA は 1：1 なので、10.0 mL 中の V も 4.00×10⁻⁵ mol。\n250 mL 全体ではその 25 倍：1.00×10⁻³ mol\nV の質量：1.00×10⁻³ × 51 = 5.10×10⁻² g → ③", "k25t:1.1": "誤りは ②。同じ周期では、原子番号が大きいほど陽子が増えて原子核の正電荷が大きくなり、電子を強く引きつけるので、原子は「小さく」なる（例：Li ＞ Be ＞ … ＞ F）。\n① 同族では下ほど電子殻が増えるので大きくなる。正しい。\n③ 陽イオンは最外殻の電子を失い、電子殻が1つ減るなどして小さくなる。正しい。\n④ 陰イオンは電子が増えて電子どうしの反発が大きくなり、大きくなる。正しい。", "k25t:1.2": "Ａは面心立方格子の配置なので、単位格子中に 1/8 × 8（頂点）+ 1/2 × 6（面心）= 4 個。\nＢは「4個のＡがつくる正四面体の重心」にあり、図から単位格子の中に 8 個（立方体を8つに分けた小立方体それぞれの中心）。\nＡ：Ｂ = 4：8 = 1：2（ホタル石 CaF₂ 型）。\n配位数：Ｂ1個は 4個のＡに囲まれる。数が Ａの2倍の Ｂ が4個ずつ Ａ に接するので、Ａ1個は 4 × 2 = 8 個の Ｂ に囲まれる。\n配位数 8、Ａ 4、Ｂ 8 → ②", "k25t:1.3": "液体と気体が共存している間（体積 V₀ まで）は、温度が一定なので圧力は飽和蒸気圧 P₀ のまま変わらない。\nすべて気体になった後は、物質量・温度が一定なのでボイルの法則 PV = 一定。\nP = P₀V₀ / V → 2V₀ で 0.5P₀、4V₀ で 0.25P₀ と、反比例の曲線で下がる。\n「V₀ まで水平、その後なめらかに反比例で下がる」→ ②\n（③ は直線的に下がっていて反比例になっていない）", "k25t:1.4": "ａ 誤りは ④。溶質を溶かすと溶液の体積は水だけのときより増える。だから 1 mol/L のショ糖水溶液 1 L の中の水は 1 L より少なく、水 1 L とは物質量が同じにならない。\n① 温度で溶液の体積が変わるので、モル濃度（mol/L）は変わる。正しい。\n② 質量モル濃度（mol/kg）は質量だけで決まるので、温度で変わらない。正しい。\n③ 1 mol/kg ならどちらも「水 1 kg に溶質 1 mol」なので、溶質と水の物質量の比は同じ。正しい。\nｂ 凝固点降下度は、溶けている粒子の質量モル濃度に比例する。\nNaCl → Na⁺ + Cl⁻（粒子2個）、Na₂SO₄ → 2Na⁺ + SO₄²⁻（粒子3個）\n0.052 × 3/2 = 0.078 K → ③\nｃ ΔT = Kf × m より、温度から「その時点の水溶液の質量モル濃度」が分かる。\n点A：0.370 = 1.85 × m → m = 0.200 mol/kg → 液体の水は 0.100 ÷ 0.200 = 0.500 kg\n点B：0.740 = 1.85 × m → m = 0.400 mol/kg → 液体の水は 0.100 ÷ 0.400 = 0.250 kg\nショ糖は液体側にだけ残るので、凍って氷になった水の増加量は 0.500 − 0.250 = 0.250 kg → ①\n（過冷却で一気に凍るため、点A ではすでに氷ができている）", "k25t:2.1": "誤りは ④。ハロゲン化銀のうち AgCl・AgBr・AgI は水に溶けにくいが、フッ化銀 AgF は水によく溶ける。\n① H₂・CO₂・He はどれも無色・無臭。正しい。\n② HCl・HBr・HI は強酸（HF だけが弱酸）。正しい。\n③ アルカリ金属は常温の水と反応して H₂ を出す。正しい。", "k25t:2.2": "誤りは ③。金は硝酸にも溶けない。金を溶かすのは王水（濃硝酸と濃塩酸を 1：3 で混ぜたもの）。\n① HClO₄：(+1) + x + (−2)×4 = 0 → x = +7。正しい。\n② SO₂ は、H₂S に対しては酸化剤、KMnO₄ などに対しては還元剤としてはたらく。正しい。\n④ P₄O₁₀ + 6H₂O → 4H₃PO₄。正しい。\n⑤ 濃硫酸の脱水作用でスクロースから H と O が水として取られ、炭素が残る。正しい。", "k25t:2.3": "混ぜた後の体積は 5.0 + 0.50 = 5.5 mL。\n各金属イオン：1.0×10⁻² × 5.0/5.5 ≒ 9.1×10⁻³ mol/L\nSO₄²⁻：1.0×10⁻³ × 0.50/5.5 ≒ 9.1×10⁻⁵ mol/L\n濃度の積：9.1×10⁻³ × 9.1×10⁻⁵ ≒ 8.3×10⁻⁷ (mol/L)²\nＡ（Mg²⁺）：MgSO₄ は 3.0 mol/L まで溶けるので沈殿しない → 無\nＢ（Ca²⁺）：8.3×10⁻⁷ ＜ 1.9×10⁻⁴ なので沈殿しない → 無\nＣ（Ba²⁺）：8.3×10⁻⁷ ＞ 9.2×10⁻¹¹ なので沈殿する → 有\n無・無・有 → ⑦", "k25t:2.4": "ａ 誤りは ③。2Al(OH)₃ → Al₂O₃ + 3H₂O なので、Al(OH)₃ 2 mol から Al₂O₃ 1 mol と水「3 mol」ができる。\n① CO₂ は酸性の気体で、OH⁻ と反応するので pH は下がる。正しい。\n② OH⁻ が CO₂ に消費されるので、平衡が右へ移って Al(OH)₃ が沈殿する。正しい。\n④ 氷晶石と混ぜると、Al₂O₃ だけ（融点約 2000 ℃）より低い約 1000 ℃ で融解できる。正しい。\nｂ Al：2.70×10⁵ ÷ 27 = 1.00×10⁴ mol。Al³⁺ + 3e⁻ → Al なので電子は 3.00×10⁴ mol。\n電気量：3.00×10⁴ × 9.65×10⁴ = 2.895×10⁹ C → 電流 = 2.895×10⁹ ÷ 9650 = 3.00×10⁵ A\n陽極の C：1.08×10⁵ ÷ 12 = 9.00×10³ mol が CO か CO₂ になった。\nCO を a mol、CO₂ を b mol とすると\na + b = 9.00×10³（炭素の数）\n2a + 4b = 3.00×10⁴（電子の数）\n→ b = 6.00×10³ mol\n3.00×10⁵ A、6.00×10³ mol → ⑤\nｃ Al(NH₄)(SO₄)₂ 100 mg は 100/237 mmol。Al は2つで Al₂(SO₄)₃ や Al₂O₃ 1つになるので、\nAl₂(SO₄)₃：100 × 342 / (2 × 237) ≒ 72 mg（約 450〜550 ℃ で減る）\nAl₂O₃：100 × 102 / (2 × 237) ≒ 22 mg（約 650〜950 ℃ で減る）\n100 → 約 72 → 約 22 mg と2段階で減るグラフ → ①\n（加熱で気体が出ていくので、質量が増える ⑤ ⑥ はありえない）", "k25t:3.1": "付加反応は ② と ⑤（H₂ が付加）。① ④ は置換反応、③ は脱離反応。\n② CH₃–C≡C–CH₃ に H₂ が1分子付加すると、2-ブテン CH₃–CH=CH–CH₃ になる。C=C の2つの炭素と、それに直接つく原子はすべて同じ平面上にあるので、炭素4つが同一平面 → 正解\n⑤ シクロヘキサンは C=C がなく、炭素は正四面体形の結合をもつので、6つの炭素は同一平面にない（いす形）。", "k25t:3.2": "切れた結合の両端の炭素に Br がつく。\nア（CH(CH₃) と CH₂ の間）が切れる：Br–CH(CH₃)–CH₂–CH₂–Br\n→ Br がつく CH は H・CH₃・Br・CH₂CH₂Br の4つが全部違う → 不斉炭素あり ○\nイ もアと同じ形の結合なので、同じ化合物ができる → ○\nウ（CH₂ と CH₂ の間）が切れる：Br–CH₂–CH(CH₃)–CH₂–Br\n→ まん中の C に CH₂Br が2つつくので不斉炭素なし → ×\n○・○・× → ⑤", "k25t:3.3": "誤りは ①。ポリ酢酸ビニルは鎖状の高分子で、加熱すると軟らかくなる熱可塑性樹脂（接着剤やチューインガムに使われる）。\n② アラミド繊維（ケブラーなど）はとても強く、防弾チョッキなどに使われる。正しい。\n③ メラミン樹脂はメラミンとホルムアルデヒドからつくる。正しい。\n④ シリコーンゴムの主鎖は –Si–O–Si–O– で、C=C をもたない。正しい。", "k25t:3.4": "エステルＤ CH₃CH₂–CO–O–CH₂CH₂CH₃ を酸とアルコールに分ける。\n酸の部分：CH₃CH₂COOH（プロピオン酸）→ カルボン酸Ｂ\nアルコールの部分：CH₃CH₂CH₂OH（1-プロパノール）→ アルコールＣ ＝ イ\nカルボン酸Ｂ（炭素3個）は、炭素数が同じ第一級アルコール CH₃CH₂CH₂OH を酸化してできる → アルコールＡ ＝ イ\nイ・イ → ⑤", "k25t:3.5": "ａ 正しいのは ③。図4で、二重結合 0→1 では約 70 ℃ から約 13 ℃ へ、約 57 K 下がる。1→2、2→3 では 20 K 以下しか下がらない。\n① 図3で、分子量 172→200→228 の融点は約 31→43→54 ℃ で、n が 2 増えると約 11〜12 K ずつ上がる。20 K ではない。\n② CH₃(CH₂)₂₀COOH は炭素数 22 で分子量 340。図3の傾向をのばすと約 80 ℃。70 ℃ は分子量 284 のステアリン酸の値。\n④ C₁₇H₃₁COOH はリノール酸（二重結合2つ）で融点は約 −5 ℃。常温で液体。\nｂ 液体の油脂は、融点の低い不飽和脂肪酸を多く含む。\n油脂イは常温で液体なのに、オレイン酸（C）は少なく、B が半分以上をしめる。だから B も融点の低い不飽和脂肪酸のはず。\n選択肢で不飽和脂肪酸はリノール酸だけ（ミリスチン酸・パルミチン酸・ステアリン酸は飽和で常温では固体）→ ④\n（実際、油脂イは大豆油のように、リノール酸の多い植物油と考えられる）", "k25t:4.1": "ａ 石灰石（CaCO₃）を強く熱すると酸化カルシウム（生石灰）CaO ができる（ア → ③）。\nCaO + H₂O → Ca(OH)₂（消石灰）\n壁に塗った Ca(OH)₂ は空気中の二酸化炭素と反応して（イ → ⑤）\nCa(OH)₂ + CO₂ → CaCO₃ + H₂O\n炭酸カルシウムになって固まる（ウ → ②）。顔料は CaCO₃ の中に閉じこめられるので色が長持ちする（フレスコ画）。\nｂ Ca(OH)₂ → Ca²⁺ + 2OH⁻ なので、[Ca²⁺] = ½[OH⁻]。\nKsp = [Ca²⁺][OH⁻]² = ½[OH⁻]³ = 5.00×10⁻⁶ → [OH⁻]³ = 1.00×10⁻⁵\n[OH⁻] = 10^(−5/3) → pOH = 5/3 ≒ 1.67\npH = 14 − 1.67 ≒ 12.3 → ⑤", "k25t:4.2": "Cu₃(CO₃)₂(OH)₂ を a mol、Cu₂CO₃(OH)₂ を b mol とする。\n式⑴：Cu₃(CO₃)₂(OH)₂ → 3CuO + H₂O + 2CO₂\n式⑵：Cu₂CO₃(OH)₂ → 2CuO + H₂O + CO₂\nH₂O：a + b = 0.50\nCO₂：2a + b = 0.70\n→ a = 0.20 mol、b = 0.30 mol\n加熱でできた CuO：3 × 0.20 + 2 × 0.30 = 1.20 mol\nはじめからあった CuO：1.30 − 1.20 = 0.10 mol → ①", "k25t:4.3": "ａ 式⑶ より Na₂S₂O₄ 1 mol から電子 2 mol が出る。式⑷ よりインジゴ 1 mol は電子 2 mol を受け取る。\n→ Na₂S₂O₄ とインジゴは 1：1 で反応する。\nx = 0.10 g のとき：インジゴ 0.10 ÷ 262 ≒ 3.8×10⁻⁴ mol\n必要な Na₂S₂O₄ 水溶液：3.8×10⁻⁴ ÷ 0.20 = 1.9×10⁻³ L ≒ 1.9 mL\n原点を通る直線で、0.10 g のとき約 1.9 mL → ③\n（NaOH は 0.20 mol あり十分足りるので、直線が途中で折れることはない）\nｂ 酸化も還元もされないのは ④。安息香酸とメタノールのエステル化（脱水縮合）で、酸化数は変わらない。\n① 2-プロパノールは二クロム酸カリウムで酸化されてアセトンになる。\n② マルトースは還元糖で、フェーリング液を還元する（マルトース自身は酸化される）。\n③ ニトロベンゼンは水素で還元されてアニリンになる。\nｃ 最後に –NH₂ と –SO₃H がパラ（p-）の位置にあればよい。性質Ⅲより、アニリンをスルホン化すれば p- の位置に –SO₃H が入る。\nだからアニリンを先につくる：ベンゼン →（ニトロ化）ニトロベンゼン →（還元）アニリン →（スルホン化）p-アミノベンゼンスルホン酸\nニトロ化・還元・スルホン化 → ④\n（性質Ⅰ・Ⅱのように、先にスルホン化やニトロ化を2回すると m-（メタ）の位置に入ってしまう）", "k25t:5.1": "ヘスの法則：反応エンタルピー ＝（反応物の燃焼エンタルピーの和）−（生成物の燃焼エンタルピーの和）。CO₂ は燃焼しないので 0。\nΔH = (−2803) − 2 × (−1368) = −2803 + 2736 = −67 kJ\nΔH が負なので発熱反応 → ③", "k25t:5.2": "pH 9.3 → 8.3（0.50 mL）：CO₃²⁻ + H⁺ → HCO₃⁻\n→ はじめの CO₃²⁻ は 1.00 × 0.50/1000 = 5.0×10⁻⁴ mol。これが HCO₃⁻ に変わった。\npH 8.3 → 4.0（6.00 − 0.50 = 5.50 mL）：HCO₃⁻ + H⁺ → H₂O + CO₂\n→ このとき反応した HCO₃⁻ は 5.50×10⁻³ mol。\nこれは「はじめからあった HCO₃⁻」と「CO₃²⁻ から変わった 5.0×10⁻⁴ mol」の合計。\nはじめの HCO₃⁻：5.50×10⁻³ − 0.50×10⁻³ = 5.00×10⁻³ mol\n濃度：5.00×10⁻³ ÷ 0.100 = 5.00×10⁻² mol/L → ④", "k25t:5.3": "もとの実験：H₂・I₂ 各 0.50 mol から HI 0.80 mol で平衡（0.80² ÷ (0.10 × 0.10) = 64 で確かめられる）。\n条件Ⅰ（体積2倍）：\n・反応の前後で気体の分子数が同じ（1 + 1 = 2）なので、平衡定数の式から体積が消え、平衡時の HI は同じ 0.80 mol。\n・濃度が半分になるので、正反応の速度 v₁ = k₁[H₂][I₂] ははじめ 1/4 になり、ゆっくり進む。\n同じ 0.80 mol に、ゆっくり近づく → ③\n条件Ⅱ（H₂ 3倍、I₂ 1/3倍）：\n・[H₂][I₂] は 3 × 1/3 = 1 倍なので、はじめの反応速度は同じ（立ち上がりが重なる）。\n・I₂ は 0.50 × 1/3 ≒ 0.17 mol しかないので、HI は最大でも 0.33 mol。実際に計算するとほぼ 0.33 mol で平衡。\nはじめは同じ傾きで、約 0.33 mol で平らになる → ②\n（④ は立ち上がりが遅くまちがい）", "k25t:5.4": "ａ 陰イオン（Cl⁻）だけを通すには、膜に「正の電荷をもつ」官能基が固定されていればよい。正電荷が Cl⁻ を引きつけて通し、Na⁺ ははね返す。\n–CH₂N⁺(CH₃)₃（第四級アンモニウム基）は正電荷をもつ → ②\n③ –SO₃⁻ は負電荷なので、逆に陽イオンを通す（陽イオン交換膜の官能基）。① ④ は電荷をもたない。\nｂ 電子 1 mol 分の電気が流れると、\n・希釈室1：Na⁺ 1 mol が陽イオン交換膜を通って濃縮室へ、Cl⁻ 1 mol が陰イオン交換膜を通って陽極側へ出ていく\n・希釈室2：Cl⁻ 1 mol が陰イオン交換膜を通って濃縮室へ、Na⁺ 1 mol が陰極側へ出ていく\n→ 濃縮室の NaCl は 1 mol 増え、希釈室1の NaCl は 1 mol 減る。\n流れた電子を n mol とすると\n濃縮室：xV + n、希釈室1：xV − n\nxV + n = 2(xV − n) → n = xV/3\nQ = nF = xVF/3 → ⑥", "k26:1.1": "ア「二重結合をもつ」とイ「水溶液が弱い酸性」の両方を満たすものを探す。\n② 二酸化炭素 O=C=O は C=O の二重結合を2つもち、水に溶けると炭酸 H₂CO₃ となって弱い酸性を示す。→ 正解\n① 臭化水素 HBr は単結合のみで、水溶液は強酸。\n③ エチレン CH₂=CH₂ は二重結合をもつが、水にほとんど溶けず酸性を示さない。\n④ 過酸化水素 H–O–O–H は単結合のみ。", "k26:1.2": "電気泳動で陽極側へ移動したので、粘土のコロイド粒子は負の電荷をもつ。\n負のコロイドを凝析させるのは陽イオンで、価数が大きいほど少量で凝析する。\n陽イオンの価数：K⁺ 1、Ca²⁺ 2、Al³⁺ 3、Mg²⁺ 2。グルコースは電解質ではない。\nよって価数最大の Al³⁺ を含む ③ 塩化アルミニウム。", "k26:1.3": "誤りは ③。飽和溶液と固体が共存しているときも、固体から溶け出す粒子と固体にもどる粒子の数が等しくなっている（溶解平衡）だけで、移動が止まっているわけではない。\n① 多くの固体は高温ほど溶解度が大きい。正しい。\n② 水和水をもつ物質の溶解度は、水100 g に溶ける無水物の質量で表す。正しい。\n④ 温度による溶解度の差を利用して精製する方法が再結晶。正しい。", "k26:1.4": "面 abcd は、上下の層Aの六角形を「向かい合う頂点 a と b（d と c）」を通る対角線で切った縦の面。\n層Aの原子：対角線上には頂点 a・中心・b（下は d・中心・c）の3個ずつが並ぶので、上辺と下辺に3個ずつ。\n層Bの原子：層Aの3つの原子がつくるくぼみ（三角形の中心）の真上にあり、六角形の中心を通る対角線上には乗らない。\nしたがって中段には原子の中心がない ① が正しい。", "k26:1.5": "ａ 容器内の O₂ の物質量は\nn = PV/RT = (1.0×10⁵ × 0.249 × 0.20) / (8.3×10³ × 300) = 2.0×10⁻³ mol\n燃焼の式は C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O なので、エタノールは O₂ の 1/3。\n2.0×10⁻³ ÷ 3 ≒ 6.7×10⁻⁴ mol → ③\nｂ 体積一定なので、圧力は「物質量 × 絶対温度」に比例する。\nP / P₀ = 1.13 × (3600 / 300) = 13.56 ≒ 1.4×10¹ 倍 → ②", "k26:2.1": "誤りは ③。発熱して溶けるとき、系のエンタルピーは減るので溶解エンタルピーは負の値になる。\n① 一定圧力下で反応に伴って出入りする熱量が反応エンタルピー。正しい。\n② 反応エンタルピー ＝（生成物のエンタルピー）－（反応物のエンタルピー）。正しい。\n④ C（黒鉛）＋O₂ → CO₂ と CO ＋ ½O₂ → CO₂ の燃焼エンタルピーの差から、ヘスの法則で CO の生成エンタルピーが求まる。正しい。", "k26:2.2": "陰極では Ag⁺ + e⁻ → Ag、Pb²⁺ + 2e⁻ → Pb。\nAg：108 mg ÷ 108 g/mol = 1.0×10⁻³ mol → 電子 1.0×10⁻³ mol\nPb：207 mg ÷ 207 g/mol = 1.0×10⁻³ mol → 電子 2.0×10⁻³ mol\n電子の合計 3.0×10⁻³ mol × 9.65×10⁴ C/mol ≒ 290 C → ③", "k26:2.3": "v = k[N₂O₅] より k = v ÷（平均濃度）。\n0〜10 分：v = 3.2×10⁻³ mol/L ÷ 10 min = 3.2×10⁻⁴ mol/(L·min)\nk = 3.2×10⁻⁴ ÷ 10.8×10⁻³ ≒ 3.0×10⁻² /min\n（10〜20 分でも 2.4×10⁻⁴ ÷ 8.0×10⁻³ = 3.0×10⁻² でほぼ同じ）→ ①", "k26:2.4": "ａ ア NH₄NO₃：強酸と弱塩基の塩。NH₄⁺ が H⁺ を出すので酸性。\nイ NaHSO₄：HSO₄⁻ がさらに電離して H⁺ を出すので酸性。\nウ NaHCO₃：弱酸と強塩基の塩で、弱い塩基性。\n酸性はア・イ → ④\nｂ H⁺ を加えると、多量にある A⁻ と結びついて HA になる（H⁺ + A⁻ → HA）。\nつまり (2)式の平衡は左側に移動し、[HA] が増え [A⁻] が減る → ②\nｃ 緩衝液は「弱酸とその塩」または「弱塩基とその塩」の混合物。\n② アンモニア水:塩酸 ＝ 2:1 では、NH₃ の半分が NH₄Cl になり、NH₃ と NH₄Cl が同量ずつ残る → 緩衝液。\n① 1:1 では NH₄Cl だけ、③ は NaCl 水溶液、④ 1:1 では CH₃COONa だけになり、緩衝作用は弱い。→ ②", "k26:3.1": "水 H₂O の H の酸化数は +1。\n① NaH（水素化ナトリウム）は Na⁺ と H⁻ からなり、H の酸化数は −1 → 正解。\nNH₃・H₂O₂・HF の H はいずれも +1。\nポイント：H の酸化数は、ふつう +1。ただし金属の水素化物（NaH・CaH₂ など）では、H が電子を受け取って H⁻ になるので −1。\n確かめ方：化合物全体で酸化数の和は 0。NaH では Na が +1 なので H は −1。", "k26:3.2": "誤りは ②。空気中で自然発火するので水中に保管するのは黄リン。赤リンは自然発火しない。\n① 核酸（DNA・RNA）にはリン酸が含まれる。正しい。\n③ 燃焼すると十酸化四リン P₄O₁₀。正しい。\n④ P₄O₁₀ は吸湿性が強く乾燥剤になる。正しい。\n⑤ リン酸 H₃PO₄ は3価の酸。正しい。", "k26:3.3": "加熱で水和水だけが抜けるので、水和物と無水物の物質量は等しい。\n2.46 / (m + 222) = 1.20 / (m + 96)\n2.46m + 236.16 = 1.20m + 266.4\n1.26m = 30.24　→　m = 24（Mg）→ ①\n考え方：硫酸塩の水和物 MSO₄・7H₂O（式量 m＋222）を加熱すると水だけが出ていき、無水物 MSO₄（式量 m＋96）になる。M の数（物質量）は変わらない。\nそこで「水和物の物質量 ＝ 無水物の物質量」、つまり（質量）÷（式量）どうしを等しいとおく。\n求めた m ＝ 24 は Mg の原子量（MgSO₄・7H₂O）。選択肢に代入して 2.46/(24＋222) ＝ 0.0100、1.20/(24＋96) ＝ 0.0100 と一致することも確かめられる。", "k26:3.4": "誤りは ⑤。錯イオンの配位数は 6 だけではない。例：[Ag(NH₃)₂]⁺ は 2、[Cu(NH₃)₄]²⁺ は 4、[Fe(CN)₆]³⁻ は 6。\n① 典型元素以外が遷移元素。正しい。\n② 遷移元素は第4周期（Sc〜Cu）から現れる。正しい。\n③ 遷移元素はすべて金属元素。正しい。\n④ 第4周期の遷移元素の最外殻電子は 1 または 2 個。正しい。", "k26:3.5": "ａ FeS が沈殿する条件は [Fe²⁺][S²⁻] ＞ Ksp。\n[S²⁻] ＞ 2.5×10⁻⁹ ÷ 0.010 = 2.5×10⁻⁷ mol/L\n[S²⁻] = K[H₂S]/[H⁺]² を代入すると\n[H⁺]² ＜ (1.0×10⁻²¹ × 0.10) ÷ (2.5×10⁻⁷) = 4.0×10⁻¹⁶\n[H⁺] ＜ 2.0×10⁻⁸ mol/L → ③\nｂ ④ の順に考える。\n操作Ⅰ NaOH 水溶液を過剰に：Ag⁺ → Ag₂O（褐色）、Fe³⁺ → Fe(OH)₃（赤褐色）が沈殿。Zn²⁺ は [Zn(OH)₄]²⁻ となって溶け、K⁺ もろ液に残る。\n操作Ⅱ 沈殿にアンモニア水を過剰に：Ag₂O は [Ag(NH₃)₂]⁺ となって溶け（ろ液B・無色）、Fe(OH)₃ は残る（沈殿A・赤褐色）。\n操作Ⅲ ろ液に H₂S：塩基性なので ZnS（白色）が沈殿（沈殿C）、K⁺ はろ液Dに残る。→ ④", "k26:4.1": "正しいのは ①。ベンゼンスルホン酸ナトリウムを固体の NaOH と高温で融解すると（アルカリ融解）ナトリウムフェノキシドができる。\n② クロロベンゼンを NaOH 水溶液と高温・高圧で反応させると、Cl が置き換わってナトリウムフェノキシドになる（Cl は残らない）。\n③ ナトリウムフェノキシドに CO₂ を高温・高圧で反応させると、サリチル酸ナトリウム（OH の隣に COONa）ができる。安息香酸ナトリウムではない。\n④ サリチル酸に無水酢酸を作用させると OH がアセチル化されてアセチルサリチル酸になる。サリチル酸メチルはメタノールとの反応でできる。", "k26:4.2": "Ⅰ〜Ⅳを順に確かめる。\n⑤ CH₃–CH(OH)–CH₂–C≡C–CH₃：分子式 C₆H₁₀O、三重結合で臭素水を脱色、OH のついた C が不斉炭素、CH₃–CH(OH)– の部分でヨードホルム反応。すべて当てはまる → ⑤\n① 不斉炭素がない。② 分子式が C₆H₈O。③ ヨードホルム反応を示さない。④ 臭素水を脱色しない（C=C も C≡C もない）。⑥ 不斉炭素がない。", "k26:4.3": "C₄H₈ のアルケンは\n1-ブテン CH₂=CH–CH₂–CH₃\n2-ブテン CH₃–CH=CH–CH₃\n2-メチルプロペン CH₂=C(CH₃)₂\nの3つ。このうちシス・トランス異性体があるのは、二重結合の両端の炭素にそれぞれ異なる2つの原子（団）がつく 2-ブテンだけ。\n構造異性体 3、立体異性体がある構造異性体 1。", "k26:4.4": "誤りは ④。アミロースは α-グルコースが直鎖状につながったもの。らせん構造の中に I₂ などが取り込まれて青〜濃青色になる、という部分は正しい。\n① 二糖は単糖2分子の脱水縮合物で、その結合はグリコシド結合。正しい。\n② マルトースはデンプンをアミラーゼで分解するとできる。正しい。\n③ トレハロースは還元性を示す部分どうしで結合しているので、銀鏡反応を示さない。正しい。\n⑤ もち米のデンプンはほぼアミロペクチン。正しい。", "k26:4.5": "ａ ア 構造式でアミド結合（–CO–NH–）を数えると2つ。誤り。\nイ カルボキシ基 –COOH を2つ、アミノ基を1つもつので水溶液は酸性。正しい。\nウ –S–S– はジスルフィド結合。正しい。\n正しいのはイ・ウ → ⑥\nｂ グリシンは pH によって形が変わる。\nA（強い酸性、pH 約2）：H₃N⁺–CH₂–COOH → ③\nB（1つめの中和点付近、pH 約6）：双性イオン H₃N⁺–CH₂–COO⁻ → ②\nC（強い塩基性、pH 約12）：H₂N–CH₂–COO⁻ → ④", "k26:5.1": "ａ 誤りは ③。CrO₄²⁻（黄色）は酸性にすると Cr₂O₇²⁻（赤橙色）になり、塩基性にすると CrO₄²⁻ にもどる。記述は酸と塩基が逆。\n① クロムは不動態をつくり、めっきに使われる。正しい。\n② ステンレス鋼は Fe に Cr（や Ni）を加えた合金。正しい。\n④ CrO₄²⁻ と Pb²⁺ から PbCrO₄ の黄色沈殿。正しい。\nｂ 誤りは ④。光ファイバーに使われるのは高純度の二酸化ケイ素 SiO₂（石英ガラス）で、Si の単体ではない。\n① Si はダイヤモンドと同じ正四面体構造の共有結合の結晶。正しい。\n② アモルファスシリコンは原子の並びが不規則。正しい。\n③ SiO₂ + 6HF → H₂SiF₆ + 2H₂O で溶かして除ける。正しい。", "k26:5.2": "ａ 無水フタル酸の酸無水物の部分にアニリンの –NH₂ が反応すると、一方の C=O はアミド結合 –CO–NH–C₆H₅ に、もう一方はカルボキシ基 –COOH になる。これが ⑤。\nこの –COOH と –NH– が分子内で脱水するとイミド結合（環）ができる。\nｂ A の繰り返し単位は、\n・ベンゼン環の両側にイミドの環が2つ → 酸無水物の部分を2つもつ イ\n・2つのベンゼン環が –O– でつながり、それぞれパラ位で N と結合 → –O– をはさんだパラ位のジアミン エ\nからできている。オは –NH₂ がメタ位なので形が合わない。→ ⑤（イ・エ）", "k26:5.3": "ａ Ⅱ アセトアルデヒドを酸化すると酢酸 → D は酢酸。\nⅢ 酸化してケトンになるのは第二級アルコール → E は第二級アルコール。\n② CH₃COO–CH(CH₃)–CH₂CH₂CH₃ は、酢酸と 2-ペンタノール（第二級）のエステル → ②\n① はギ酸、⑤⑥ は酢酸以外のカルボン酸、③④ のアルコールは第一級なのでケトンにならない。\nｂ CH₃COOH + C₂H₅OH ⇄ CH₃COOC₂H₅ + H₂O\n平衡時：酢酸 4.0−3.0 = 1.0、エタノール 5.0−3.0 = 2.0、酢酸エチル 3.0、水 3.0（mol）\n体積は約分されるので K = (3.0 × 3.0) / (1.0 × 2.0) = 4.5 → ⑧", "k26t:1.1": "共有結合の結晶は、原子どうしが共有結合で立体的につながった巨大な結晶。\n② 二酸化ケイ素 SiO₂ は Si と O が共有結合で網目状につながっている → 正解\n① ドライアイスと ⑤ ナフタレンは分子結晶、③ ナトリウムは金属結晶、④ 塩化ナトリウムはイオン結晶。", "k26t:1.2": "浸透圧は溶けている粒子（イオンや分子）の物質量に比例する（ファントホッフの法則）。\nCaCl₂·2H₂O：4.41 ÷ 147 = 3.00×10⁻² mol\nCaCl₂ → Ca²⁺ + 2Cl⁻ と3個に分かれるので、粒子は 3.00×10⁻² × 3 = 9.00×10⁻² mol\nグルコースは電離しないので、同じ 9.00×10⁻² mol が必要。\n9.00×10⁻² × 180 = 16.2 g → ⑤", "k26t:1.3": "溶質の物質量は cV (mol)、その質量は McV (g)。\n質量パーセント濃度 ＝（溶質の質量）÷（溶液の質量）× 100 ＝ 100McV / W → ①\n考え方：濃度の換算は「溶質の質量」と「溶液の質量」を別々に出してから割る。\n・溶質：物質量 c (mol/L) × V (L) ＝ cV (mol)、質量はモル質量 M をかけて McV (g)\n・溶液：問題で与えられた溶液の質量 W (g)（水の質量ではない点に注意）\n単位の確認：(g)÷(g)×100 で % になっていれば OK。", "k26t:1.4": "Z ＞ 1 は、実在気体の体積が理想気体として計算した値より大きいことを表す。\n高圧で分子どうしが近づくと、分子自身の体積が無視できなくなり、その分だけ体積が大きくなる。→ ③\n① 分子間力がはたらくと体積は小さくなり Z ＜ 1 の方向に働く。H₂ は分子間力がとても弱いので、この圧力範囲では分子の体積の効果が勝つ。\n② 温度は 500 K で一定。④ 500 K の H₂ は液体にならない。", "k26t:1.5": "ａ 空気の物質量 n = PV/RT = (1.0×10⁵ × 0.249) / (8.3×10³ × 300) = 1.00×10⁻² mol\n質量 = 1.00×10⁻² × 28.8 ≒ 0.29 g → ①\nｂ ア 加熱中にフラスコ上部で凝縮したトルエンがあれば、その分トルエンの質量が多く量られ、モル質量は大きく出る。小さくなる原因ではないので誤り。\nイ 冷却後もトルエンの一部は蒸発して気体になり、その分の空気がフラスコから追い出されている。差し引く空気の質量が実際より大きいことになり、トルエンの質量が小さく量られるので、モル質量も小さく出る。正しい。\nア 誤・イ 正 → ③", "k26t:2.1": "正しいのは ①。反応速度は単位時間当たりの反応物の濃度の減少量（または生成物の増加量）で表す。\n② 一般に温度が高いほど反応速度は大きい。\n③ 反応速度式は実験で決まり、濃度に比例するとは限らない（2乗に比例する反応などもある）。\n④ 触媒は活性化エネルギーを小さくして反応速度を大きくする。", "k26t:2.2": "純水では [H⁺] = [OH⁻] なので [H⁺]² = 4.0×10⁻¹⁴、[H⁺] = 2.0×10⁻⁷ mol/L。\npH = −log(2.0×10⁻⁷) = 7 − log 2 = 7 − 0.3 = 6.7 → ②\n（高温の純水は pH が 7 より小さいが、[H⁺] = [OH⁻] なので中性）", "k26t:2.3": "PbCl₂ が沈殿し始めるときの [Cl⁻]：\n[Pb²⁺][Cl⁻]² = 1.6×10⁻⁵ → [Cl⁻]² = 1.6×10⁻⁵ ÷ 1.0×10⁻⁴ = 0.16 → [Cl⁻] = 0.40 mol/L\nこのとき AgCl は飽和しているので\n[Ag⁺] = 8.4×10⁻¹¹ ÷ 0.40 = 2.1×10⁻¹⁰ mol/L → ②", "k26t:2.4": "ａ 誤りは ④。触媒は活性化エネルギーを下げて反応を速くするが、反応エンタルピー（ΔH）は変えない。\n① ΔH ＞ 0（吸熱反応）なので、温度を上げると吸熱の向き＝生成物側に移動する。正しい。\n② 気体の分子数は 左 3（1＋2）→ 右 5（1＋4）。圧力を上げると分子数が減る向き＝反応物側に移動する。正しい。\n③ 触媒は平衡を移動させない。正しい。\nｂ 1 g 当たりの発熱量 ＝（燃焼エンタルピーの大きさ）÷（モル質量）\n水素 286 ÷ 2 = 143 kJ/g、メタン 890 ÷ 16 ≒ 56 kJ/g、プロパン 2200 ÷ 44 = 50 kJ/g\n水素がとび抜けて大きく、メタンがプロパンより少し大きいグラフ → ②\n（④ は 1 mol 当たりの値をそのまま並べたもの。③ はプロパンがメタンより大きくなっていて誤り。① は水素の値が大きすぎる）\nｃ 100 mol の H₂O ができたので、発生したエネルギーは 286 × 100 = 28600 kJ。\n熱として残ったのは 28600 − 16000 = 12600 kJ。\n温水の質量を m (g) とすると 4.2 × m × (42.0 − 22.0) = 12600×10³\nm = 1.5×10⁵ g = 150 kg → ②", "k26t:3.1": "乾燥剤は「中和反応や、ほかの化合物をつくる反応を起こさないもの」を選ぶ。\n② 酸素は中性の気体で、塩化カルシウム（中性の乾燥剤）と反応しないので乾燥できる → 正解\n① アンモニア（塩基性）は濃硫酸（酸性）と中和してしまう。\n③ 塩化水素（酸性）は酸化カルシウム（塩基性）と反応してしまう。\n④ 二酸化炭素（酸性）はソーダ石灰（塩基性）に吸収されてしまう。\n（アンモニアは塩化カルシウムとも結びつくので、ソーダ石灰で乾燥させる）", "k26t:3.2": "誤りは ④。鉛 Pb は水素よりイオン化傾向が大きいが、希硫酸に入れると表面に水に溶けにくい硫酸鉛(Ⅱ) PbSO₄ ができ、反応がすぐ止まるのでほとんど溶けない（希塩酸でも PbCl₂ ができて溶けにくい）。\n① 黒鉛は平面の層が積み重なった構造。正しい。\n② 活性炭は小さな穴が多く表面積が大きいので、においの分子を吸着する。正しい。\n③ 鉄にスズをめっきしたものがブリキ（缶詰の缶など）。正しい。", "k26t:3.3": "実験Ⅰ：Zn + 2HCl → ZnCl₂ + H₂ より、Zn 1 mol から H₂ 1 mol。\n→ Zn の物質量は H₂ 60 mL 分に比例する。\n実験Ⅱ：3Ag + 4HNO₃ → 3AgNO₃ + 2H₂O + NO より、Ag 3 mol から NO 1 mol。\n→ Ag の物質量は NO 40 mL の3倍＝120 mL 分に比例する。\n同じ条件の気体の体積は物質量に比例するので\nZn : Ag = 60 : 120 = 1 : 2 → ⑤", "k26t:3.4": "ａ 正しいのは ④。2族の硫酸塩は CaSO₄・BaSO₄ が水に溶けにくく、MgSO₄ だけがよく溶ける。\n① Mg・Ca・Ba はいずれも空気中で酸化される。② Ca と Ba は常温の水と反応するが、Mg は熱水でないと反応しにくい（Mg のみ、は逆）。③ 水に溶けにくい水酸化物は Mg(OH)₂。Ba(OH)₂ はよく溶ける。⑤ 炭酸塩はどれも水に溶けにくい。\nｂ 変換が必要なのは MgO だけ。\nMgO の質量：1.0×10³ kg × 0.040 = 40 kg = 4.0×10⁴ g → 4.0×10⁴ ÷ 40 = 1.0×10³ mol\n式 2MgO + C + 2Cl₂ → 2MgCl₂ + CO₂ より、MgO と Cl₂ は 1 : 1\nCl₂ は 1.0×10³ mol → ①\nｃ Ti の物質量は W/M (mol)。\nTiCl₄ + 2Mg → Ti + 2MgCl₂ より、Ti 1 mol をつくるのに Mg 2 mol が必要。\nMg²⁺ + 2e⁻ → Mg より、Mg 1 mol をつくるのに電子 2 mol が必要。\n→ Ti 1 mol 当たり電子 4 mol。（このとき陽極で Cl₂ 2 mol もでき、それが TiO₂ を TiCl₄ にする Cl₂ 2 mol にちょうど使われる。MgCl₂ はくり返し使われるので、電気量はこれだけでよい）\n電気量 = 4 × (W/M) × F = 4WF/M → ⑧", "k26t:4.1": "ａ 一方のみに当てはまるのは ④。プロピレンに臭素が付加した CH₃–C*HBr–CH₂Br の C* は4つとも違う原子・原子団がつくので不斉炭素原子。エチレンからできる CH₂Br–CH₂Br にはない。\n① どちらも常温で気体。② どちらも C=C をもち、その部分は回転できない。③ どちらも立体異性体はない（プロピレンは二重結合の片方の炭素に H が2つつくのでシス・トランスもない）。⑤ どちらも C=C があり KMnO₄ の色を消す。\nｂ プロピレン CH₂=CH–CH₃ の C=C に何かが付加すると、となり合う 1・2 番目の炭素に原子がつく。\nア H₂ の付加 → CH₃–CH₂–CH₃ ○\nイ ポリプロピレンなら –[CH₂–CH(CH₃)]– になるはず。枝のない –[CH₂–CH₂–CH₂]– にはならない ×\nウ Cl₂ の付加なら CH₂Cl–CHCl–CH₃。3つの炭素すべてに Cl はつかない ×\nエ アセトンはクメン法などでつくり、付加反応では得られない ×\nオ H₂O の付加 → CH₃–CH(OH)–CH₃（2-プロパノール） ○\nア・オ → ④", "k26t:4.2": "誤りは ④。スズと濃塩酸は「還元」に使う試薬で、–NO₂ を –NH₂ に変える（ニトロベンゼン → アニリンと同じ）。–NH₂ を –NO₂ にするのではない。\n① アミノ基（–NH₂ や –N(CH₂CH₃)₂）をもつので弱塩基性。正しい。\n② エステル結合 –COO– をもつので、NaOH で加熱するとけん化（加水分解）される。正しい。\n③ ベンゼン環についた –NH₂ は、ジアゾ化 → カップリングで橙色のアゾ化合物になる。正しい。", "k26t:4.3": "ａ ア「ベンゼン環をもつ異性体がほかにもある」\nキシレン C₈H₁₀ → エチルベンゼンがある ○\nクレゾール C₇H₈O → ベンジルアルコール、アニソール（メチルフェニルエーテル）がある ○\nジクロロベンゼン C₆H₄Cl₂ → ベンゼン環に Cl 2つの o・m・p だけ ×\nイ「パラ体が防虫剤」→ p-ジクロロベンゼンだけ\nウ「NaOH と中和」→ フェノール類のクレゾールだけ\nキシレン：ア → ①、クレゾール：ア・ウ → ⑤、ジクロロベンゼン：イ → ②\nｂ 正しいのは ④。クレゾールはどれもベンゼン環に直接 –OH がつくフェノール類なので、塩化鉄(Ⅲ)で呈色する。\n① 構造が違うので沸点・融点は異なる。② 分子内で脱水して酸無水物になるのは、2つの –COOH が隣り合うフタル酸（o-キシレンから）だけ。③ どのクレゾールも –OH をもち、無水酢酸でアセチル化されエステルになる。", "k26t:4.4": "条件を1つずつ確かめる。\nⅠ アデニンの「五員環の N–H の N」とリボースの「1位の C（O ととなり合う炭素）」がつながる。\n→ ② はアデニンの –NH₂（六員環側）でつながっているので ×。① と ③ と ④ は五員環の N でつながっている。\nⅡ リン酸はリボースの「–CH₂–OH」の O とつながる。\n→ ① はリン酸が1位側、④ は環についた –OH（3位）とつながっていて ×。\n両方を満たすのは ③。", "k26t:5.1": "誤りは ④。銅の電解精錬では、粗銅を「陽極」、純銅を「陰極」にする。陽極の粗銅から Cu が Cu²⁺ として溶け出し、イオン化傾向の小さい金や銀は溶けずに陽極の下にたまる（陽極泥）。これで金を分けられる。\n① 金は展性・延性が最も大きい（金箔）。② 金属光沢は自由電子による。③ 金は熱濃硫酸にも溶けず、王水には溶ける。", "k26t:5.2": "NaOH 水溶液を少し加えるとどれも水酸化物の沈殿になるが、過剰に加えると両性の金属（Al・Zn・Pb）の水酸化物は溶ける。\nAl(OH)₃ → [Al(OH)₄]⁻、Zn(OH)₂ → [Zn(OH)₄]²⁻、Pb(OH)₂ → [Pb(OH)₄]²⁻\nCu(OH)₂（青白色）は過剰の NaOH にも溶けずに残る → ②\n（なおアンモニア水を過剰に加えると Cu(OH)₂ は溶けるので注意）", "k26t:5.3": "液体 He の質量：1.20×10² g/L × 0.100 L = 12.0 g → 12.0 ÷ 4.0 = 3.00 mol\n0℃、1.00×10⁵ Pa では 3.00 mol の体積は 22.7 × 3.00 = 68.1 L。\n同じ温度で 10.0 L に押し込めるので、ボイルの法則より\nP = 1.00×10⁵ × 68.1 ÷ 10.0 = 6.81×10⁵ Pa → ③", "k26t:5.4": "ａ 生ゴムに硫黄を数％加えて加熱すると、分子鎖どうしが硫黄でつながり（架橋）、弾性が増す（加硫）。硫黄を 30〜40％加えると黒くて硬いエボナイトになる。→ ①\nノボラックはフェノール樹脂をつくるときの中間体で、ゴムとは関係ない。\nｂ ポリイソプレンは –CH₂–C(CH₃)=CH–CH₂– のくり返し。シス形とは、C=C をはさんで「鎖をつなぐ CH₂ どうし」が同じ側にあるもの。\n② は2つの C=C のどちらでも、両側の CH₂ が同じ側にある → 正解\n④・⑤ は CH₂ が反対側のトランス形（グッタペルカの構造）。① と ③ は C=C が並ぶ別の構造で、ポリイソプレンではない。\nｃ 付加した H₂：67.2 ÷ 22.4 = 3.00 mol\nブタジエン単位1つに C=C が1つなので、ブタジエン単位は 3.00 mol → n = 3.00 mol 分。\n水素付加後のブタジエン単位（C₄H₈）は 56 なので、その質量は 56 × 3.00 = 168 g。\n残りがスチレン単位：220 − 168 = 52 g → 52 ÷ 104 = 0.500 mol → m = 0.500 mol 分。\nm/n = 0.500 ÷ 3.00 = 1/6 → ⑤"};/*EXPL_END*/

/* ================= 採点 ================= */
function gradeItems(items,ans){return items.map(it=>{const u=it.boxes.map(b=>ans[b]);let ok;
 if(it.mode==='any'){const x=[...u].sort().join(','),y=[...it.a].sort().join(',');ok=x===y}
 else ok=it.boxes.every((b,k)=>ans[b]===it.a[k]);
 /* 部分点：「各2点」の順不同（each）と、正解表の注にある別解（alt） */
 let got=ok?it.pts:0;
 if(!ok&&it.each){const seen=new Set();u.forEach(v=>{if(v!=null&&it.a.includes(v))seen.add(v)});got=seen.size*it.pts/it.boxes.length}
 if(!ok&&it.alt&&it.alt[u[0]]!=null)got=it.alt[u[0]];
 /* 順不同の組では、個々のマークが正解の集合に入っていれば「合っている」と表示する */
 const boxOk=it.boxes.map((b,k)=>it.mode==='any'?it.a.includes(ans[b]):ans[b]===it.a[k]);
 return{it,ok,got,boxOk}})}
function summarize(st,qs,ans,its){const g=gradeItems(its||itemsOf(st,qs),ans);const byQ={};
 g.forEach(r=>{const o=byQ[r.it.q]=byQ[r.it.q]||[0,0];o[0]+=r.got;o[1]+=r.it.pts});
 return{g,byQ,score:g.reduce((a,r)=>a+r.got,0),max:g.reduce((a,r)=>a+r.it.pts,0)}}

   ${rb==='wq'?'<p class="note" style="margin-top:6px">今週の記録は毎週月曜にリセットされます。</p>':''}`}
 catch(e){const r=$('#rank');if(r)r.innerHTML='<p class="note">いまは表示できません。時間をおいて開き直してください。</p>'}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(sess&&!sess.done){S.cur=sess}saveNow()}});

/* ---- マイページ ---- */
function vSettings(){return`<div class="stack">${tip('my','ニックネーム、毎日のお知らせ、記録の引き継ぎ、問題冊子のダウンロードはここから。')}
${RANK_ON?` <div class="sheet stack"><h3>プロフィール</h3><label class="setline"><b>ニックネーム</b><input type="text" id="nick" maxlength="16" placeholder="例：たろう" value="${esc(S.nick||'')}" style="max-width:55%"></label>
 <div class="setline"><div><b>ランキングに参加</b></div>${seg('socSeg',[['on','参加'],['off','しない']],S.social===false?'off':'on')}</div></div>`:''}
 <div class="sheet stack"><h3>アカウント・データの引き継ぎ</h3><p class="lead" style="font-size:.88rem">記録はこの端末の中に保存されます。機種変更や iPad との共有は「書き出す」で保存したファイルを、新しい端末で「読み込む」と引き継げます。</p>
 <div class="row"><button class="btn sm" id="exp">記録を書き出す</button><button class="btn sm" id="imp">記録を読み込む</button><input type="file" id="impF" accept=".json,application/json" hidden></div></div>
 <div class="sheet stack"><h3>ダウンロード（問題冊子・正解表）</h3>${SETS.map(st=>`<div class="dlrow"><b>${st.name}</b><span class="row"><button class="btn sm" data-dl="${st.id}:q">問題</button><button class="btn sm" data-dl="${st.id}:a">正解</button></span></div>`).join('')}</div>
${NOTI()?` <div class="sheet stack"><h3>お知らせ</h3><div class="setline"><div><b>毎日のお知らせ</b></div>${seg('ntSeg',[['on','受け取る'],['off','オフ']],S.notif?'on':'off')}</div>
 ${S.notif?`<div class="setline"><b>時間</b>${seg('ntH',[['7','朝7時'],['17','17時'],['20','20時'],['22','22時']],String(S.notifH||20))}</div>`:''}</div>`:''}
 <div class="sheet stack"><h3>演習</h3><div class="setline"><div><b>残り時間を表示</b></div>${seg('tmSeg',[['on','表示'],['off','経過時間']],S.set.timer?'on':'off')}</div>
 <div class="setline"><b>効果音</b>${seg('sdSeg',[['on','鳴らす'],['off','消す']],S.set.sound?'on':'off')}</div></div>
 <div class="sheet stack"><h3>サポート</h3><div class="row"><button class="btn sm" id="howto">使い方</button><button class="btn sm" id="rateApp">アプリを評価する</button><button class="btn sm" id="feedback">ご意見・不具合報告</button></div>
 <p class="note">収録：共通テスト「化学」2021〜2026年度の全12回（本試験・追試験、2021年度は第1日程・第2日程）。問題・正解は大学入試センターの公表資料です。分野はアプリによる大まかな分類です。本アプリは大学入試センターとは関係のない個人の学習用アプリです。</p></div>
 <div class="sheet stack"><h3>データ</h3><div><button class="btn sm" id="resetAll">${confirmDel?'本当に成績を消す（元に戻せません）':'成績をリセット'}</button></div></div></div>`}
bind.settings=()=>{document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.dl.split(':');dlPdf(setById(i),k)});
 $('#exp').onclick=()=>{const d=new Date();const name=`共テ化学_記録_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const txt=JSON.stringify({app:'kyochem',v:1,at:Date.now(),data:Object.assign({},S,{fb:undefined,cur:null})});const h=nativeMsg('share');
  if(h){h.postMessage({id:++shareSeq,fileText:txt,name});return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove()};
 $('#imp').onclick=()=>$('#impF').click();
 $('#impF').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='kyochem'||!j.data||!Array.isArray(j.data.hist))throw 0;
  if(!confirm(`記録${j.data.hist.length}件を読み込みます。いまの記録は置き換わります。よろしいですか？`))return;const fb=S.fb;S=Object.assign(JSON.parse(JSON.stringify(DEF)),j.data,{fb});saveNow();toast('記録を読み込みました');render()}catch(_){alert('このファイルは読み込めません。「記録を書き出す」で作ったファイルを選んでください。')}};
 if($('#nick'))$('#nick').onchange=e=>{S.nick=e.target.value.trim().slice(0,16);save();fbSync(true);toast('ニックネームを保存しました')};
 if($('#socSeg'))$('#socSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.social=b.dataset.val==='on';save();if(S.social)fbSync(true);else if(S.fb&&S.fb.uid)fsFetch(`/${FB.col}/${S.fb.uid}`,{method:'DELETE'}).catch(()=>{});render()};
 $('#sdSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.set.sound=b.dataset.val==='on';save();if(S.set.sound)snd('done');render()};
 if($('#ntSeg'))$('#ntSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const h=NOTI();if(b.dataset.val==='on')h.postMessage({act:'request',hour:S.notifH||20,done:todayN()>0,streak:streak()});else{h.postMessage({act:'off'});S.notif=false;save();render()}};
 if($('#ntH'))$('#ntH').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.notifH=+b.dataset.val;save();notifSync();render()};
 $('#tmSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.set.timer=b.dataset.val==='on';save();render()};
 $('#howto').onclick=()=>{S.tut=0;save();go('home')};
 $('#rateApp').onclick=()=>{const h=nativeMsg('review');if(h)h.postMessage({});else toast('App Storeで評価できます')};
 $('#feedback').onclick=()=>{const u=SITE_URL+'/support.html';const h=nativeMsg('openURL');if(h)h.postMessage({url:u});else window.open(u,'_blank')};
 $('#resetAll').onclick=()=>{if(!confirmDel){confirmDel=true;render();return}confirmDel=false;S.hist=[];S.days={};S.cur=null;S.rate=null;S.rateBest=0;saveNow();toast('成績をリセットしました');render()}};

render();setTimeout(notifSync,3000);
</script>
</body></html>
